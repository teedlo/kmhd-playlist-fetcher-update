<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMHD Playlist Fetcher</title>
    <script>
        // Applied before first paint so there's no flash of the wrong theme.
        // Defaults to the visitor's OS/browser preference; a saved manual
        // choice (from the toggle button) overrides that default.
        (function () {
            try {
                const saved = localStorage.getItem('theme');
                if (saved === 'dark' || saved === 'light') {
                    document.documentElement.setAttribute('data-theme', saved);
                }
            } catch (e) { /* localStorage unavailable; fall back to OS preference via CSS */ }
        })();
    </script>
    <style>
        :root {
            --bg: #fff;
            --fg: #333;
            --header-bg: #eee;
            --border: #ddd;
            --placeholder-bg: #eee;
            --highlight-bg: #ffffcc;
            --link: #06c;
            --muted: #666;
            --error: #a00;
            --badge-bg: #eef3fb;
            --badge-fg: #345;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #16181c;
                --fg: #e2e2e2;
                --header-bg: #23262b;
                --border: #33363c;
                --placeholder-bg: #23262b;
                --highlight-bg: #3a3820;
                --link: #6cb2ff;
                --muted: #999;
                --error: #ff8080;
                --badge-bg: #1f2a38;
                --badge-fg: #9cc0e8;
            }
        }
        :root[data-theme="dark"] {
            --bg: #16181c;
            --fg: #e2e2e2;
            --header-bg: #23262b;
            --border: #33363c;
            --placeholder-bg: #23262b;
            --highlight-bg: #3a3820;
            --link: #6cb2ff;
            --muted: #999;
            --error: #ff8080;
            --badge-bg: #1f2a38;
            --badge-fg: #9cc0e8;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
            color: var(--fg);
            background: var(--bg);
        }
        h1 {
            margin-bottom: 20px;
        }
        form {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 5px;
        }
        input[type="date"], button {
            font-size: 1.5em;
            padding: 10px;
            margin: 5px;
        }
        #themeToggle {
            font-size: 1.3em;
            padding: 8px 12px;
            cursor: pointer;
            background: var(--header-bg);
            color: var(--fg);
            border: 1px solid var(--border);
            border-radius: 6px;
        }
        table {
            width: 100%;
            max-width: 60em;
            margin: 0 auto;
            border-collapse: collapse;
            margin-top: 20px;
        }
        td {
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 8px;
            text-align: left;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        a {
            color: var(--link);
        }
        .hour-header {
            background-color: var(--header-bg);
            font-weight: bold;
            text-align: center;
        }
        .date-header {
            background-color: var(--badge-bg);
            color: var(--badge-fg);
            font-weight: bold;
            text-align: center;
            font-size: 1.1em;
            padding: 10px 8px;
        }
        #showSelect {
            font-size: 1.1em;
            padding: 10px;
            margin: 5px;
            max-width: 16em;
            background: var(--header-bg);
            color: var(--fg);
            border: 1px solid var(--border);
            border-radius: 6px;
        }
        #backToDate {
            display: none;
            margin: 0 auto 10px;
            max-width: 60em;
            text-align: left;
        }
        #backToDate a {
            cursor: pointer;
        }
        #loadMoreWrap {
            display: none;
            margin: 16px auto;
            text-align: center;
        }
        #loadMoreWrap button {
            font-size: 1.1em;
            padding: 8px 16px;
            cursor: pointer;
            background: var(--header-bg);
            color: var(--fg);
            border: 1px solid var(--border);
            border-radius: 6px;
        }
        .album-cover-container {
            position: relative;
            display: block;
            margin: 0 auto;
            width: 50px;
            height: 50px;
        }
        .album-cover, .album-placeholder {
            width: 100%;
            height: 100%;
        }
        .album-placeholder {
            background-color: var(--placeholder-bg);
        }
        .play-button, .pause-button {
            position: absolute;
            bottom: 5px;
            left: 5px;
            width: 16px;
            height: 16px;
            color: white;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-shadow: 0 0 4px black;
        }
        .play-button::before {
            content: '▶';
        }
        .pause-button::before {
            content: '⏸';
        }
        .pause-button {
            display: none;
        }
        .start-time {
            white-space: nowrap;
            width: 1%;
            text-align: right;
        }
        .column-details {
            width: 99%;
            word-wrap: break-word;
        }
        .bold {
            font-weight: bold;
        }
        .small {
            font-size: 0.9em;
            font-style: italic;
            color: var(--muted);
        }
        .genre-badge {
            display: inline-block;
            font-size: 0.75em;
            font-style: normal;
            font-weight: bold;
            padding: 1px 6px;
            border-radius: 3px;
            background: var(--badge-bg);
            color: var(--badge-fg);
            margin-left: 6px;
        }
        .track-links {
            margin-top: 3px;
            font-size: 0.8em;
        }
        .track-links a {
            margin-right: 10px;
            white-space: nowrap;
        }
        .highlight {
            background-color: var(--highlight-bg);
        }
        #loading, #error {
            display: none;
        }
        #error {
            color: var(--error);
        }
        footer {
            margin-top: 20px;
            font-size: 0.8em;
            color: var(--muted);
        }
        footer a {
            color: var(--muted);
        }
        footer a:hover {
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            body {
                margin: 10px;
                padding: 0;
            }
            table {
                margin: 0;
                border-left: none;
                border-right: none;
            }
            td {
                border-left: none;
                border-right: none;
                padding: 8px 4px;
            }
        }
    </style>
</head>
<body>

    <h1 id="pageHeader">KMHD Playlist</h1>

    <form id="dateForm" action="" method="get">
        <input type="date" id="dateInput" name="date" required>
        <button type="submit" id="submitButton" disabled>Fetch Playlist</button>
        <select id="showSelect" aria-label="Browse by show">
            <option value="">By Show ▾</option>
        </select>
        <button type="button" id="themeToggle" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
    </form>

    <div id="backToDate"><a id="backToDateLink">&larr; Back to date view</a></div>

    <div id="loading">Loading...</div>
    <div id="error">Couldn&rsquo;t load the playlist for that date. Try another date, or try again later.</div>

    <table id="playlistTable">
        <tbody>
        </tbody>
    </table>

    <div id="loadMoreWrap"><button type="button" id="loadMoreButton">Load earlier episodes</button></div>

    <footer>
        Data provided by <a href="https://www.kmhd.org/playlist/" target="_blank">KMHD</a>. Album art, previews &amp; links from <a href="https://performance-partners.apple.com/search-api" target="_blank">iTunes Search</a>. Code generated by <a href="https://github.com/mccutchen/kmhd-playlist-fetcher" target="_blank">ChatGPT</a>.
    </footer>

    <script src="playlist-utils.js"></script>
    <script src="shows-schedule.js"></script>
    <script>
        // ------------------------------------------------------------------
        // KMHD changed their playlist API in 2026: it no longer returns
        // iTunes-enriched objects (trackName, previewUrl, artworkUrl100 ...).
        // It now returns: { title, artist: [..], album, duration, releaseDate,
        // trackNumber, start: {utc, local, timezone}, end: {...}, artworkUrl? }
        //
        // This page now renders the raw KMHD data immediately, then lazily
        // re-adds album art, 30-second previews and Apple Music links by
        // querying the public iTunes Search API for rows as they scroll into
        // view (throttled to respect iTunes' ~20 requests/minute limit, with
        // results cached in localStorage for 30 days).
        // ------------------------------------------------------------------

        let currentAudio = null;
        let currentPlayButton = null;
        let currentPauseButton = null;
        let currentRow = null;

        function fetchPlaylist(date) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            const apiUrl = `https://www.kmhd.org/pf/api/v3/content/fetch/playlist?query=${encodeURIComponent(JSON.stringify({ day: date }))}`;
            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    if (!Array.isArray(data)) throw new Error('Unexpected API response');
                    renderPlaylist(data);
                    updatePageHeader(date);
                    document.getElementById('loading').style.display = 'none';
                    if (data.length === 0) {
                        document.getElementById('error').textContent = 'No playlist data for that date.';
                        document.getElementById('error').style.display = 'block';
                    }
                })
                .catch(error => {
                    console.error('Error fetching playlist:', error);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('error').style.display = 'block';
                });
        }

        // Builds a single <tr> for one track. Shared by the daily view
        // (renderPlaylist) and the "By Show" view (renderShowHistory) so
        // both get identical rendering, album art, links and iTunes
        // enrichment behavior.
        function buildTrackRow(item) {
            const startTime = PlaylistUtils.trackStartDate(item);
            const options = { hour: 'numeric', minute: 'numeric', hour12: true };
            const localTime = startTime ? startTime.toLocaleTimeString([], options).replace(/^0/, '') : '';

            const { title, artist, album } = PlaylistUtils.mapItemFields(item);

            const row = document.createElement('tr');

            // Time cell
            const timeCell = document.createElement('td');
            timeCell.className = 'start-time';
            timeCell.textContent = localTime;
            row.appendChild(timeCell);

            // Artwork cell
            const artCell = document.createElement('td');
            const albumCoverContainer = document.createElement('div');
            albumCoverContainer.className = 'album-cover-container';
            if (item.artworkUrl) {
                const img = document.createElement('img');
                img.src = item.artworkUrl;
                img.alt = 'Album Cover';
                img.className = 'album-cover';
                albumCoverContainer.appendChild(img);
            } else {
                const ph = document.createElement('div');
                ph.className = 'album-placeholder';
                albumCoverContainer.appendChild(ph);
            }
            artCell.appendChild(albumCoverContainer);
            row.appendChild(artCell);

            // Details cell (plain text now; iTunes enrichment upgrades to links)
            const detailsCell = document.createElement('td');
            detailsCell.className = 'column-details';
            const titleEl = document.createElement('span');
            titleEl.className = 'bold track-title';
            titleEl.textContent = title;
            const artistEl = document.createElement('span');
            artistEl.className = 'bold track-artist';
            artistEl.textContent = artist;
            detailsCell.appendChild(titleEl);

            // Genre badge (filled in later by iTunes enrichment, when available)
            const genreBadge = document.createElement('span');
            genreBadge.className = 'genre-badge track-genre';
            genreBadge.style.display = 'none';
            detailsCell.appendChild(genreBadge);

            detailsCell.appendChild(document.createTextNode(' by '));
            detailsCell.appendChild(artistEl);

            const year = PlaylistUtils.trackYear(item);
            if (album || year) {
                detailsCell.appendChild(document.createElement('br'));
                const albumLine = document.createElement('span');
                albumLine.className = 'small';
                if (album) {
                    albumLine.appendChild(document.createTextNode('from '));
                    const albumEl = document.createElement('span');
                    albumEl.className = 'bold track-album';
                    albumEl.textContent = album;
                    albumLine.appendChild(albumEl);
                }
                if (year) {
                    albumLine.appendChild(document.createTextNode(album ? ` (${year})` : `(${year})`));
                }
                detailsCell.appendChild(albumLine);
            }

            // Search links: YouTube (live video), Apple Music (via iTunes
            // enrichment below), Tidal, eBay (vinyl) and Wikipedia (band).
            // These are plain search-results links, so they work
            // instantly for every track with no extra API calls.
            if (title && artist) {
                const links = PlaylistUtils.searchLinks({ title, artist, album });
                const linksRow = document.createElement('div');
                linksRow.className = 'track-links';
                const addLink = (url, label) => {
                    if (!url) return;
                    const a = document.createElement('a');
                    a.href = url;
                    a.target = '_blank';
                    a.rel = 'noopener';
                    a.textContent = label;
                    linksRow.appendChild(a);
                };
                addLink(links.youtube, 'YouTube (live)');
                addLink(links.tidal, 'Tidal');
                addLink(links.ebayVinyl, 'eBay (vinyl)');
                addLink(links.wiki, 'Wiki');
                detailsCell.appendChild(linksRow);
            }

            row.appendChild(detailsCell);

            // Queue this row for iTunes enrichment when it becomes visible
            if (title && artist) {
                observeForEnrichment(row, albumCoverContainer, { title, artist, album });
            }

            return row;
        }

        function renderPlaylist(data) {
            const tbody = document.querySelector('#playlistTable tbody');
            tbody.innerHTML = '';  // Clear existing rows
            let lastHour = null;

            data.forEach(item => {
                const startTime = PlaylistUtils.trackStartDate(item);
                const currentHour = startTime ? startTime.toLocaleTimeString([], { hour: 'numeric', hour12: true }).replace(/^0/, '') : '';

                if (startTime && lastHour !== currentHour) {
                    const hourHeaderRow = document.createElement('tr');
                    const hourHeaderCell = document.createElement('td');
                    hourHeaderCell.colSpan = 3;
                    hourHeaderCell.className = 'hour-header';
                    hourHeaderCell.textContent = currentHour;
                    hourHeaderRow.appendChild(hourHeaderCell);
                    tbody.appendChild(hourHeaderRow);
                    lastHour = currentHour;
                }

                tbody.appendChild(buildTrackRow(item));
            });
        }

        // ---------------- iTunes Search enrichment ----------------

        const ITUNES_INTERVAL_MS = 3500;   // ~17 req/min, under iTunes' ~20/min limit
        const CACHE_PREFIX = 'itunes1:';
        const CACHE_TTL_MS = 30 * 24 * 60 * 60 * 1000;  // 30 days
        const enrichQueue = [];
        let queueTimer = null;
        let jsonpCounter = 0;

        const intersectionObserver = ('IntersectionObserver' in window)
            ? new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && entry.target._enrichJob) {
                        enrichQueue.push(entry.target._enrichJob);
                        delete entry.target._enrichJob;
                        intersectionObserver.unobserve(entry.target);
                        pumpQueue();
                    }
                });
            }, { rootMargin: '200px' })
            : null;

        function observeForEnrichment(row, coverContainer, meta) {
            const job = { row, coverContainer, meta };
            const cached = cacheGet(meta);
            if (cached !== undefined) {
                // Cached (hit or known miss): apply immediately, no API call needed
                if (cached) applyEnrichment(job, cached);
                return;
            }
            if (intersectionObserver) {
                row._enrichJob = job;
                intersectionObserver.observe(row);
            } else {
                enrichQueue.push(job);
                pumpQueue();
            }
        }

        function pumpQueue() {
            if (queueTimer || enrichQueue.length === 0) return;
            processNext();
        }

        function processNext() {
            const job = enrichQueue.shift();
            if (!job) { queueTimer = null; return; }
            queueTimer = setTimeout(() => { queueTimer = null; processNext(); }, ITUNES_INTERVAL_MS);
            itunesLookup(job.meta, result => {
                cacheSet(job.meta, result);
                if (result) applyEnrichment(job, result);
            });
        }

        function itunesLookup(meta, done) {
            // JSONP keeps this working regardless of CORS policy on itunes.apple.com
            const term = `${meta.artist} ${meta.title}`;
            const cbName = `itunesCb${++jsonpCounter}`;
            const script = document.createElement('script');
            let finished = false;
            const finish = result => {
                if (finished) return;
                finished = true;
                delete window[cbName];
                script.remove();
                done(result);
            };
            window[cbName] = data => {
                const r = (data && data.results && data.results[0]) || null;
                finish(r ? {
                    artworkUrl100: r.artworkUrl100 || null,
                    previewUrl: r.previewUrl || null,
                    trackViewUrl: r.trackViewUrl || null,
                    artistViewUrl: r.artistViewUrl || null,
                    collectionViewUrl: r.collectionViewUrl || null,
                    collectionName: r.collectionName || null,
                    // iTunes' genre is the best "niched" genre we can get
                    // without asking you to sign up for another API key
                    // (e.g. Last.fm) — it's often more specific than a
                    // station-wide label, e.g. "Bebop" or "Vocal Jazz".
                    primaryGenreName: r.primaryGenreName || null,
                    releaseDate: r.releaseDate || null
                } : null);
            };
            script.onerror = () => finish(null);
            setTimeout(() => finish(null), 15000);  // safety timeout
            script.src = `https://itunes.apple.com/search?media=music&entity=song&limit=1&term=${encodeURIComponent(term)}&callback=${cbName}`;
            document.head.appendChild(script);
        }

        function applyEnrichment(job, info) {
            const { row, coverContainer } = job;

            // Album art (prefer iTunes art; fall back to whatever KMHD gave us)
            if (info.artworkUrl100) {
                coverContainer.innerHTML = '';
                const img = document.createElement('img');
                img.src = info.artworkUrl100;
                img.alt = 'Album Cover';
                img.className = 'album-cover';
                coverContainer.appendChild(img);
            }

            // Links
            const linkify = (el, url) => {
                if (!el || !url) return;
                const a = document.createElement('a');
                a.href = url;
                a.target = '_blank';
                a.className = el.className;
                a.textContent = el.textContent;
                el.replaceWith(a);
            };
            linkify(row.querySelector('.track-title'), info.trackViewUrl);
            linkify(row.querySelector('.track-artist'), info.artistViewUrl);
            linkify(row.querySelector('.track-album'), info.collectionViewUrl);

            // Explicit "Apple Music" link alongside the other search links
            const linksRow = row.querySelector('.track-links');
            if (linksRow && info.trackViewUrl) {
                const a = document.createElement('a');
                a.href = info.trackViewUrl;
                a.target = '_blank';
                a.rel = 'noopener';
                a.textContent = 'Apple Music';
                linksRow.insertBefore(a, linksRow.firstChild);
            }

            // Genre badge (best available "niched" genre, from iTunes)
            const genreBadge = row.querySelector('.track-genre');
            if (genreBadge && info.primaryGenreName) {
                genreBadge.textContent = info.primaryGenreName;
                genreBadge.style.display = 'inline-block';
            }

            // 30-second preview player
            if (info.previewUrl) {
                coverContainer.style.cursor = 'pointer';

                const playButton = document.createElement('div');
                playButton.className = 'play-button';
                coverContainer.appendChild(playButton);

                const pauseButton = document.createElement('div');
                pauseButton.className = 'pause-button';
                coverContainer.appendChild(pauseButton);

                let audio = null;

                coverContainer.addEventListener('click', () => {
                    if (!audio) {
                        audio = new Audio(info.previewUrl);
                        audio.addEventListener('ended', () => {
                            playButton.style.display = 'flex';
                            pauseButton.style.display = 'none';
                            row.classList.remove('highlight');
                        });
                    }
                    if (currentAudio && currentAudio !== audio) {
                        currentAudio.pause();
                        currentPlayButton.style.display = 'flex';
                        currentPauseButton.style.display = 'none';
                        currentRow.classList.remove('highlight');
                    }
                    if (audio.paused) {
                        audio.play();
                        playButton.style.display = 'none';
                        pauseButton.style.display = 'flex';
                        row.classList.add('highlight');
                    } else {
                        audio.pause();
                        playButton.style.display = 'flex';
                        pauseButton.style.display = 'none';
                        row.classList.remove('highlight');
                    }
                    currentAudio = audio;
                    currentPlayButton = playButton;
                    currentPauseButton = pauseButton;
                    currentRow = row;
                });
            }
        }

        // ---------------- localStorage cache ----------------

        function cacheKey(meta) {
            return PlaylistUtils.cacheKey(CACHE_PREFIX, meta);
        }

        function cacheGet(meta) {
            try {
                const raw = localStorage.getItem(cacheKey(meta));
                if (!raw) return undefined;
                const entry = JSON.parse(raw);
                if (!entry || (Date.now() - entry.t) > CACHE_TTL_MS) {
                    localStorage.removeItem(cacheKey(meta));
                    return undefined;
                }
                return entry.d;  // may be null = known "no match"
            } catch (e) {
                return undefined;
            }
        }

        function cacheSet(meta, data) {
            try {
                localStorage.setItem(cacheKey(meta), JSON.stringify({ t: Date.now(), d: data }));
            } catch (e) {
                // Quota full: drop oldest iTunes entries and retry once
                try {
                    const keys = [];
                    for (let i = 0; i < localStorage.length; i++) {
                        const k = localStorage.key(i);
                        if (k && k.indexOf(CACHE_PREFIX) === 0) keys.push(k);
                    }
                    keys.slice(0, Math.ceil(keys.length / 2)).forEach(k => localStorage.removeItem(k));
                    localStorage.setItem(cacheKey(meta), JSON.stringify({ t: Date.now(), d: data }));
                } catch (e2) { /* give up quietly */ }
            }
        }

        // ---------------- date handling ----------------

        function getYesterday() {
            const date = new Date();
            date.setDate(date.getDate() - 1);
            return date.toISOString().split('T')[0];
        }

        function updatePageHeader(date) {
            const dateObj = new Date(date + 'T00:00:00');  // parse as local time (no off-by-one)
            const today = new Date();
            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            let formattedDate = dateObj.toLocaleDateString('en-US', options);
            if (dateObj.getFullYear() !== today.getFullYear()) {
                formattedDate += `, ${dateObj.getFullYear()}`;
            }
            const header = document.getElementById('pageHeader');
            header.innerHTML = '';
            header.appendChild(document.createTextNode('KMHD Playlist for '));
            const a = document.createElement('a');
            a.href = `?date=${date}`;
            a.textContent = formattedDate;
            header.appendChild(a);
        }

        // ---------------- "By Show" browsing ----------------
        // KMHD doesn't offer a per-show archive API. Instead, we know each
        // show's recurring weekly time slot (shows-schedule.js, hand-
        // transcribed from kmhd.org/schedule/), so we generate the list of
        // past dates that slot has aired on and re-use the existing per-day
        // playlist API for each one, filtering to just that show's window.

        const SHOW_BATCH_SIZE = 6;   // occurrences fetched per slot per "page"
        let currentShow = null;      // the show currently being browsed, or null
        let showBatchesLoaded = 0;   // how many SHOW_BATCH_SIZE pages have been fetched so far
        let showDatesShown = null;   // Set of dates already rendered, to avoid duplicates across slots

        function populateShowSelect() {
            const select = document.getElementById('showSelect');
            if (typeof KmhdShows === 'undefined') return;
            KmhdShows.uniqueShows().forEach(show => {
                const opt = document.createElement('option');
                opt.value = show.name;
                opt.textContent = show.host ? `${show.name} (${show.host})` : show.name;
                select.appendChild(opt);
            });
        }

        function showByName(name) {
            if (typeof KmhdShows === 'undefined') return null;
            return KmhdShows.uniqueShows().find(s => s.name === name) || null;
        }

        function startShowHistory(name) {
            const show = showByName(name);
            if (!show) return;
            currentShow = show;
            showBatchesLoaded = 0;
            showDatesShown = new Set();

            document.getElementById('dateForm').style.display = 'none';
            document.getElementById('backToDate').style.display = 'block';
            document.querySelector('#playlistTable tbody').innerHTML = '';
            document.getElementById('loadMoreWrap').style.display = 'none';

            const header = document.getElementById('pageHeader');
            header.textContent = show.host ? `${show.name} — hosted by ${show.host}` : show.name;

            loadMoreShowHistory();
        }

        function backToDateView() {
            currentShow = null;
            document.getElementById('dateForm').style.display = 'flex';
            document.getElementById('backToDate').style.display = 'none';
            document.getElementById('loadMoreWrap').style.display = 'none';
            document.getElementById('showSelect').value = '';
            const date = document.getElementById('dateInput').value || getYesterday();
            fetchPlaylist(date);
        }

        // Fetches the next batch of past occurrences for the show currently
        // being browsed (SHOW_BATCH_SIZE weeks further back per slot the
        // show airs in), and appends any that had tracks to the table.
        function loadMoreShowHistory() {
            if (!currentShow) return;
            const todayIso = new Date().toISOString().split('T')[0];
            const startWeek = showBatchesLoaded * SHOW_BATCH_SIZE;

            // Build the list of candidate dates for this batch, across all
            // of the show's weekly slots (most shows have one; a few, like
            // Positive Vibrations, air most days).
            let candidates = [];
            currentShow.slots.forEach(slot => {
                const dates = PlaylistUtils.pastWeekdayDates(slot.weekday, showBatchesLoaded * SHOW_BATCH_SIZE + SHOW_BATCH_SIZE, todayIso)
                    .slice(startWeek);
                dates.forEach(date => candidates.push({ date, slot }));
            });
            candidates.sort((a, b) => b.date.localeCompare(a.date));
            showBatchesLoaded++;

            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('loadMoreWrap').style.display = 'none';

            Promise.all(candidates.map(c =>
                fetch(`https://www.kmhd.org/pf/api/v3/content/fetch/playlist?query=${encodeURIComponent(JSON.stringify({ day: c.date }))}`)
                    .then(r => r.json())
                    .then(data => ({
                        date: c.date,
                        items: Array.isArray(data) ? data.filter(item => PlaylistUtils.trackInSlot(item, c.slot)) : []
                    }))
                    .catch(() => ({ date: c.date, items: [] }))
            )).then(results => {
                document.getElementById('loading').style.display = 'none';
                const tbody = document.querySelector('#playlistTable tbody');
                let anyRendered = false;

                results
                    .filter(r => r.items.length > 0 && !showDatesShown.has(r.date))
                    .sort((a, b) => b.date.localeCompare(a.date))
                    .forEach(r => {
                        showDatesShown.add(r.date);
                        anyRendered = true;

                        const dateObj = new Date(r.date + 'T00:00:00');
                        const dateHeaderRow = document.createElement('tr');
                        const dateHeaderCell = document.createElement('td');
                        dateHeaderCell.colSpan = 3;
                        dateHeaderCell.className = 'date-header';
                        dateHeaderCell.textContent = dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
                        dateHeaderRow.appendChild(dateHeaderCell);
                        tbody.appendChild(dateHeaderRow);

                        r.items
                            .slice()
                            .sort((a, b) => {
                                const da = PlaylistUtils.trackStartDate(a);
                                const db = PlaylistUtils.trackStartDate(b);
                                return (da ? da.getTime() : 0) - (db ? db.getTime() : 0);
                            })
                            .forEach(item => tbody.appendChild(buildTrackRow(item)));
                    });

                if (!anyRendered && showDatesShown.size === 0) {
                    document.getElementById('error').textContent = `No playlist data found yet for ${currentShow.name}. Try loading earlier episodes.`;
                    document.getElementById('error').style.display = 'block';
                }
                document.getElementById('loadMoreWrap').style.display = 'block';
            }).catch(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('loadMoreWrap').style.display = 'block';
            });
        }

        function setupShowBrowsing() {
            populateShowSelect();
            document.getElementById('showSelect').addEventListener('change', e => {
                if (e.target.value) startShowHistory(e.target.value);
            });
            document.getElementById('backToDateLink').addEventListener('click', backToDateView);
            document.getElementById('loadMoreButton').addEventListener('click', loadMoreShowHistory);
        }

        // ---------------- dark mode toggle ----------------
        // Defaults to the visitor's OS/browser preference (via the
        // prefers-color-scheme CSS media query); the button lets them
        // override that manually, and the override is remembered.

        function systemPrefersDark() {
            return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        }

        function currentTheme() {
            const saved = (() => { try { return localStorage.getItem('theme'); } catch (e) { return null; } })();
            if (saved === 'dark' || saved === 'light') return saved;
            return systemPrefersDark() ? 'dark' : 'light';
        }

        function applyThemeButtonLabel() {
            const btn = document.getElementById('themeToggle');
            btn.textContent = currentTheme() === 'dark' ? '☀️' : '🌙';
        }

        function setupThemeToggle() {
            applyThemeButtonLabel();
            document.getElementById('themeToggle').addEventListener('click', () => {
                const next = currentTheme() === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                try { localStorage.setItem('theme', next); } catch (e) { /* ignore */ }
                applyThemeButtonLabel();
            });
        }

        function enableSubmitButton() {
            const dateInput = document.getElementById('dateInput');
            const submitButton = document.getElementById('submitButton');
            const initialValue = dateInput.value;

            dateInput.addEventListener('change', () => {
                if (dateInput.value !== initialValue) {
                    submitButton.disabled = false;
                } else {
                    submitButton.disabled = true;
                }
            });
        }

        // Check if the page loaded with a date parameter and fetch playlist if true
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            let date = urlParams.get('date');
            if (!date) {
                date = getYesterday();
            }
            const dateInput = document.getElementById('dateInput');
            dateInput.value = date;
            fetchPlaylist(date);
            enableSubmitButton();
            setupThemeToggle();
            setupShowBrowsing();
        });
    </script>

</body>
</html>
