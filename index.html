<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMHD Playlist Fetcher</title>
    <script>
        // Applied before first paint so there's no flash of the wrong theme.
        // Defaults to the visitor's OS/browser preference; a saved manual
        // choice (from the toggle button) overrides that default.
        (function () {
            try {
                const saved = localStorage.getItem('theme');
                if (saved === 'dark' || saved === 'light') {
                    document.documentElement.setAttribute('data-theme', saved);
                }
            } catch (e) { /* localStorage unavailable; fall back to OS preference via CSS */ }
        })();
    </script>
    <style>
        :root {
            --bg: #fff;
            --fg: #333;
            --header-bg: #eee;
            --border: #ddd;
            --placeholder-bg: #eee;
            --highlight-bg: #ffffcc;
            --link: #06c;
            --muted: #666;
            --error: #a00;
            --badge-bg: #eef3fb;
            --badge-fg: #345;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #16181c;
                --fg: #e2e2e2;
                --header-bg: #23262b;
                --border: #33363c;
                --placeholder-bg: #23262b;
                --highlight-bg: #3a3820;
                --link: #6cb2ff;
                --muted: #999;
                --error: #ff8080;
                --badge-bg: #1f2a38;
                --badge-fg: #9cc0e8;
            }
        }
        :root[data-theme="dark"] {
            --bg: #16181c;
            --fg: #e2e2e2;
            --header-bg: #23262b;
            --border: #33363c;
            --placeholder-bg: #23262b;
            --highlight-bg: #3a3820;
            --link: #6cb2ff;
            --muted: #999;
            --error: #ff8080;
            --badge-bg: #1f2a38;
            --badge-fg: #9cc0e8;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
            color: var(--fg);
            background: var(--bg);
        }
        h1 {
            margin-bottom: 20px;
        }
        form {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 5px;
        }
        input[type="date"], button {
            font-size: 1.5em;
            padding: 10px;
            margin: 5px;
        }
        #themeToggle {
            font-size: 1.3em;
            padding: 8px 12px;
            cursor: pointer;
            background: var(--header-bg);
            color: var(--fg);
            border: 1px solid var(--border);
            border-radius: 6px;
        }
        #headnodButton {
            font-size: 1.1em;
            padding: 10px 14px;
            cursor: pointer;
            background: var(--badge-bg);
            color: var(--badge-fg);
            border: 1px solid var(--border);
            border-radius: 6px;
        }
        table {
            width: 100%;
            max-width: 60em;
            margin: 0 auto;
            border-collapse: collapse;
            margin-top: 20px;
        }
        td {
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 8px;
            text-align: left;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* Bigger, roomier "card" look for each track row — easier to tap
           and read on mobile. Same data/links as before, just more space. */
        .track-row {
            cursor: pointer;
        }
        .track-row td {
            padding: 14px 10px;
        }
        .track-row:active td {
            background-color: var(--highlight-bg);
        }
        @media (hover: hover) {
            .track-row:hover td {
                background-color: var(--header-bg);
            }
        }
        a {
            color: var(--link);
        }
        .hour-header {
            background-color: var(--header-bg);
            font-weight: bold;
            text-align: center;
        }
        .date-header {
            background-color: var(--badge-bg);
            color: var(--badge-fg);
            font-weight: bold;
            text-align: center;
            font-size: 1.1em;
            padding: 10px 8px;
        }
        #showSelect, #sortSelect {
            font-size: 1.1em;
            padding: 10px;
            margin: 5px;
            max-width: 16em;
            background: var(--header-bg);
            color: var(--fg);
            border: 1px solid var(--border);
            border-radius: 6px;
        }
        #sortWrap {
            text-align: center;
        }
        #backToDate {
            display: none;
            margin: 0 auto 10px;
            max-width: 60em;
            text-align: left;
        }
        #backToDate a {
            cursor: pointer;
        }
        #loadMoreWrap {
            display: none;
            margin: 16px auto;
            text-align: center;
        }
        #loadMoreWrap button {
            font-size: 1.1em;
            padding: 8px 16px;
            cursor: pointer;
            background: var(--header-bg);
            color: var(--fg);
            border: 1px solid var(--border);
            border-radius: 6px;
        }
        #loadMoreWrap button:disabled {
            opacity: 0.6;
            cursor: default;
        }
        .album-cover-container {
            position: relative;
            display: block;
            margin: 0 auto;
            width: 60px;
            height: 60px;
        }
        .album-cover, .album-placeholder {
            width: 100%;
            height: 100%;
        }
        .album-placeholder {
            background-color: var(--placeholder-bg);
        }
        .play-button, .pause-button {
            position: absolute;
            bottom: 6px;
            left: 6px;
            width: 18px;
            height: 18px;
            color: white;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-shadow: 0 0 4px black;
        }
        .play-button::before {
            content: '▶';
        }
        .pause-button::before {
            content: '⏸';
        }
        .pause-button {
            display: none;
        }
        .start-time {
            white-space: nowrap;
            width: 1%;
            text-align: right;
        }
        .column-details {
            width: 99%;
            word-wrap: break-word;
        }
        .bold {
            font-weight: bold;
        }
        .track-title {
            font-size: 1.06em;
        }
        .track-artist {
            font-size: 0.98em;
        }
        .small {
            font-size: 0.9em;
            font-style: italic;
            color: var(--muted);
        }
        .track-line {
            margin-top: 2px;
        }
        .track-links {
            margin-top: 8px;
            font-size: 0.85em;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
        }
        .track-links a {
            white-space: nowrap;
            padding: 4px 0;
        }
        .highlight {
            background-color: var(--highlight-bg);
        }
        #loading, #error {
            display: none;
        }
        #error {
            color: var(--error);
        }
        footer {
            margin-top: 20px;
            font-size: 0.8em;
            color: var(--muted);
        }
        footer a {
            color: var(--muted);
        }
        footer a:hover {
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            body {
                margin: 10px;
                padding: 0;
            }
            table {
                margin: 0;
                border-left: none;
                border-right: none;
            }
            td {
                border-left: none;
                border-right: none;
                padding: 8px 4px;
            }
        }
    </style>
</head>
<body>

    <h1 id="pageHeader">KMHD Playlist</h1>

    <form id="dateForm" action="" method="get">
        <input type="date" id="dateInput" name="date" required>
        <button type="submit" id="submitButton" disabled>Fetch Playlist</button>
        <select id="showSelect" aria-label="Browse by show">
            <option value="">By Show ▾</option>
        </select>
        <button type="button" id="headnodButton" title="Jump straight to The Headnod Show">★ Headnod Show</button>
        <button type="button" id="themeToggle" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
    </form>

    <!-- Lives outside #dateForm (which is hidden while browsing "By Show")
         so this sort control stays visible and usable in both views. -->
    <div id="sortWrap">
        <select id="sortSelect" aria-label="Sort tracks">
            <option value="time" selected>Sort: Time</option>
            <option value="year">Sort: Year (oldest first)</option>
        </select>
    </div>

    <div id="backToDate"><a id="backToDateLink">&larr; Back to date view</a></div>

    <div id="loading">Loading...</div>
    <div id="error">Couldn&rsquo;t load the playlist for that date. Try another date, or try again later.</div>

    <table id="playlistTable">
        <tbody>
        </tbody>
    </table>

    <div id="loadMoreWrap"><button type="button" id="loadMoreButton">Load earlier episodes</button></div>

    <footer>
        Data provided by <a href="https://www.kmhd.org/playlist/" target="_blank">KMHD</a>. Album art, previews &amp; links from <a href="https://performance-partners.apple.com/search-api" target="_blank">iTunes Search</a>. Code generated by <a href="https://github.com/mccutchen/kmhd-playlist-fetcher" target="_blank">ChatGPT</a>.
    </footer>

    <!-- Cache-busting query param (bump this string whenever playlist-utils.js
         or shows-schedule.js changes) — without it, browsers can keep serving
         an old cached copy of these files after a deploy, which silently
         breaks anything that calls a function the cached copy doesn't have
         yet (this has bitten us twice: "trackYear is not a function" after
         the dark-mode deploy, and a blank "By Show" page after this one). -->
    <script src="playlist-utils.js?v=20260816c"></script>
    <script src="shows-schedule.js?v=20260816c"></script>
    <script>
        // ------------------------------------------------------------------
        // KMHD changed their playlist API in 2026: it no longer returns
        // iTunes-enriched objects (trackName, previewUrl, artworkUrl100 ...).
        // It now returns: { title, artist: [..], album, duration, releaseDate,
        // trackNumber, start: {utc, local, timezone}, end: {...}, artworkUrl? }
        //
        // This page now renders the raw KMHD data immediately, then lazily
        // re-adds album art, 30-second previews and Apple Music links by
        // querying the public iTunes Search API for rows as they scroll into
        // view (throttled to respect iTunes' ~20 requests/minute limit, with
        // results cached in localStorage for 30 days).
        // ------------------------------------------------------------------

        let currentAudio = null;
        let currentPlayButton = null;
        let currentPauseButton = null;
        let currentRow = null;

        function fetchPlaylist(date) {
            // Shares the same generation token used by the "By Show" view
            // (see showFetchToken below) so that whichever view the user
            // switched to most recently "wins": if the user leaves this
            // view before the fetch resolves, viewToken() will have moved
            // on and the stale result is dropped instead of clobbering
            // whatever view is now on screen.
            const token = viewToken();
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            fetchDayPlaylist(date)
                .then(data => {
                    if (token !== viewToken()) return;  // stale — user switched views since this fetch started
                    renderPlaylist(data);
                    updatePageHeader(date);
                    document.getElementById('loading').style.display = 'none';
                    if (data.length === 0) {
                        document.getElementById('error').textContent = 'No playlist data for that date.';
                        document.getElementById('error').style.display = 'block';
                    }
                })
                .catch(error => {
                    if (token !== viewToken()) return;  // stale — user switched views since this fetch started
                    console.error('Error fetching playlist:', error);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('error').style.display = 'block';
                });
        }

        // Builds a single <tr> for one track. Shared by the daily view
        // (renderPlaylist) and the "By Show" view (renderShowHistory) so
        // both get identical rendering, album art, links and iTunes
        // enrichment behavior.
        function buildTrackRow(item) {
            const startTime = PlaylistUtils.trackStartDate(item);
            const options = { hour: 'numeric', minute: 'numeric', hour12: true };
            const localTime = startTime ? startTime.toLocaleTimeString([], options).replace(/^0/, '') : '';
            const rowYear = PlaylistUtils.trackYear(item);

            const { title, artist, album } = PlaylistUtils.mapItemFields(item);

            const row = document.createElement('tr');
            row.className = 'track-row';

            // Time cell — shows the clock time in Time-sort mode, or the
            // track's release year in Year-sort mode (since the rows are no
            // longer grouped/ordered by time of day there, the time isn't
            // meaningful, but the year is the whole point of that view).
            const timeCell = document.createElement('td');
            timeCell.className = 'start-time';
            timeCell.textContent = currentSort === 'year' ? (rowYear ? String(rowYear) : '') : localTime;
            row.appendChild(timeCell);

            // Artwork cell
            const artCell = document.createElement('td');
            const albumCoverContainer = document.createElement('div');
            albumCoverContainer.className = 'album-cover-container';
            if (item.artworkUrl) {
                const img = document.createElement('img');
                img.src = item.artworkUrl;
                img.alt = 'Album Cover';
                img.className = 'album-cover';
                albumCoverContainer.appendChild(img);
            } else {
                const ph = document.createElement('div');
                ph.className = 'album-placeholder';
                albumCoverContainer.appendChild(ph);
            }
            artCell.appendChild(albumCoverContainer);
            row.appendChild(artCell);

            // Details cell (plain text now; iTunes enrichment upgrades to links).
            // Each piece of info is its own line, in order: title, "by
            // Artist", "from Album", "Year - Genre", then the links row.
            const detailsCell = document.createElement('td');
            detailsCell.className = 'column-details';
            const titleEl = document.createElement('span');
            titleEl.className = 'bold track-title';
            titleEl.textContent = title;
            detailsCell.appendChild(titleEl);

            // "by Artist" line
            const artistLine = document.createElement('div');
            artistLine.className = 'track-line';
            const artistEl = document.createElement('span');
            artistEl.className = 'bold track-artist';
            artistEl.textContent = artist;
            artistLine.appendChild(document.createTextNode('by '));
            artistLine.appendChild(artistEl);
            detailsCell.appendChild(artistLine);

            // "from Album" line (no year here — it's shown below, in the
            // "Year - Genre" line)
            if (album) {
                const albumLine = document.createElement('div');
                albumLine.className = 'small track-line';
                albumLine.appendChild(document.createTextNode('from '));
                const albumEl = document.createElement('span');
                albumEl.className = 'bold track-album';
                albumEl.textContent = album;
                albumLine.appendChild(albumEl);
                detailsCell.appendChild(albumLine);
            }

            // "Year - Genre" line, below the album, above the links. Genre
            // is filled in later by iTunes enrichment (when available);
            // until then this line just shows the year, or is empty (zero
            // height — a <div> with no content doesn't leave a blank gap).
            const yearGenreLine = document.createElement('div');
            yearGenreLine.className = 'small track-yeargenre track-line';
            if (rowYear) {
                const yearEl = document.createElement('span');
                yearEl.className = 'track-year';
                yearEl.textContent = rowYear;
                yearGenreLine.appendChild(yearEl);
            }
            const genreBadge = document.createElement('span');
            genreBadge.className = 'track-genre';
            genreBadge.style.display = 'none';
            yearGenreLine.appendChild(genreBadge);
            detailsCell.appendChild(yearGenreLine);

            // Search links: YouTube (live video), Apple Music (via iTunes
            // enrichment below), Tidal, eBay (vinyl) and Wikipedia (band).
            // These are plain search-results links, so they work
            // instantly for every track with no extra API calls.
            if (title && artist) {
                const links = PlaylistUtils.searchLinks({ title, artist, album });
                const linksRow = document.createElement('div');
                linksRow.className = 'track-links';
                const addLink = (url, label) => {
                    if (!url) return;
                    const a = document.createElement('a');
                    a.href = url;
                    a.target = '_blank';
                    a.rel = 'noopener';
                    a.textContent = label;
                    linksRow.appendChild(a);
                };
                addLink(links.youtube, 'YouTube (live)');
                addLink(links.tidal, 'Tidal');
                addLink(links.ebayVinyl, 'eBay (vinyl)');
                addLink(links.wiki, 'Wiki');
                detailsCell.appendChild(linksRow);
            }

            row.appendChild(detailsCell);

            // Queue this row for iTunes enrichment when it becomes visible
            if (title && artist) {
                observeForEnrichment(row, albumCoverContainer, { title, artist, album });
            }

            return row;
        }

        // ---------------- sort control (Time / Year) ----------------
        // Shared by both the daily view and "By Show" — lives outside
        // #dateForm in the HTML so it stays visible/usable in both. Sorting
        // by year mixes tracks from different hours/dates together, so in
        // year mode the hour/date group headers are replaced with year
        // headers instead (reusing the .hour-header look).

        let currentSort = 'time';   // 'time' | 'year'
        let lastDailyData = [];     // last-rendered daily-view data, so switching sort re-renders without refetching

        function sortedByYear(items) {
            return items.slice().sort((a, b) => {
                const ya = PlaylistUtils.trackYear(a);
                const yb = PlaylistUtils.trackYear(b);
                if (ya == null && yb == null) return 0;
                if (ya == null) return 1;   // unknown year sorts last
                if (yb == null) return -1;
                if (ya !== yb) return ya - yb;   // oldest first
                // Same year: fall back to original air time for a stable, sensible order
                const ta = PlaylistUtils.trackStartDate(a);
                const tb = PlaylistUtils.trackStartDate(b);
                return (ta ? ta.getTime() : 0) - (tb ? tb.getTime() : 0);
            });
        }

        function renderGroupedByYear(tbody, items) {
            let lastLabel;   // undefined, so the very first item always starts a new header
            sortedByYear(items).forEach(item => {
                const year = PlaylistUtils.trackYear(item);
                const label = year ? String(year) : 'Unknown year';
                if (label !== lastLabel) {
                    const headerRow = document.createElement('tr');
                    const headerCell = document.createElement('td');
                    headerCell.colSpan = 3;
                    headerCell.className = 'hour-header';
                    headerCell.textContent = label;
                    headerRow.appendChild(headerCell);
                    tbody.appendChild(headerRow);
                    lastLabel = label;
                }
                tbody.appendChild(buildTrackRow(item));
            });
        }

        function renderPlaylist(data) {
            lastDailyData = data;
            const tbody = document.querySelector('#playlistTable tbody');
            tbody.innerHTML = '';  // Clear existing rows

            if (currentSort === 'year') {
                renderGroupedByYear(tbody, data);
                return;
            }

            let lastHour = null;
            data.forEach(item => {
                const startTime = PlaylistUtils.trackStartDate(item);
                const currentHour = startTime ? startTime.toLocaleTimeString([], { hour: 'numeric', hour12: true }).replace(/^0/, '') : '';

                if (startTime && lastHour !== currentHour) {
                    const hourHeaderRow = document.createElement('tr');
                    const hourHeaderCell = document.createElement('td');
                    hourHeaderCell.colSpan = 3;
                    hourHeaderCell.className = 'hour-header';
                    hourHeaderCell.textContent = currentHour;
                    hourHeaderRow.appendChild(hourHeaderCell);
                    tbody.appendChild(hourHeaderRow);
                    lastHour = currentHour;
                }

                tbody.appendChild(buildTrackRow(item));
            });
        }

        // ---------------- iTunes Search enrichment ----------------

        // Shared, server-side enrichment cache (same Cloudflare Worker that
        // proxies/caches the playlist API). When a track has already been
        // looked up by anyone, any visitor, this returns instantly with no
        // iTunes rate-limit wait at all. If the Worker doesn't have this
        // route yet (older deploy) or is unreachable, this cleanly falls
        // back to the original per-browser throttled iTunes JSONP lookup.
        const ENRICH_PROXY_URL = 'https://kmhd-playlist-cache.teedlo.workers.dev/';

        const ITUNES_INTERVAL_MS = 3500;   // ~17 req/min, under iTunes' ~20/min limit
        const SHARED_CACHE_INTERVAL_MS = 250;  // just enough to avoid a tight loop; the rate-limit-sensitive work happens on the Worker, not here
        const CACHE_PREFIX = 'itunes1:';
        const CACHE_TTL_MS = 30 * 24 * 60 * 60 * 1000;  // 30 days
        const enrichQueue = [];
        let queueTimer = null;
        let jsonpCounter = 0;

        const intersectionObserver = ('IntersectionObserver' in window)
            ? new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && entry.target._enrichJob) {
                        enrichQueue.push(entry.target._enrichJob);
                        delete entry.target._enrichJob;
                        intersectionObserver.unobserve(entry.target);
                        pumpQueue();
                    }
                });
            }, { rootMargin: '200px' })
            : null;

        function observeForEnrichment(row, coverContainer, meta) {
            const job = { row, coverContainer, meta };
            const cached = cacheGet(meta);
            if (cached !== undefined) {
                // Cached (hit or known miss): apply immediately, no API call needed
                if (cached) applyEnrichment(job, cached);
                return;
            }
            if (intersectionObserver) {
                row._enrichJob = job;
                intersectionObserver.observe(row);
            } else {
                enrichQueue.push(job);
                pumpQueue();
            }
        }

        function pumpQueue() {
            if (queueTimer || enrichQueue.length === 0) return;
            processNext();
        }

        function processNext() {
            const job = enrichQueue.shift();
            if (!job) { queueTimer = null; return; }
            enrichViaSharedCache(job.meta, result => {
                if (result !== undefined) {
                    // The Worker answered (hit or a confirmed no-match) — no
                    // iTunes rate limit was touched, so there's no need to
                    // wait before starting the next one.
                    cacheSet(job.meta, result);
                    if (result) applyEnrichment(job, result);
                    queueTimer = setTimeout(() => { queueTimer = null; processNext(); }, SHARED_CACHE_INTERVAL_MS);
                    return;
                }
                // Shared cache unreachable — fall back to the original
                // direct-to-iTunes lookup, throttled to stay under their
                // rate limit.
                queueTimer = setTimeout(() => { queueTimer = null; processNext(); }, ITUNES_INTERVAL_MS);
                itunesLookup(job.meta, result2 => {
                    cacheSet(job.meta, result2);
                    if (result2) applyEnrichment(job, result2);
                    // Share a real find with every other visitor so nobody
                    // else has to wait on iTunes for this track again.
                    // (Confirmed no-matches aren't pushed — a transient
                    // lookup hiccup shouldn't get permanently cached as
                    // "this track doesn't exist" for everyone.)
                    if (result2) pushToSharedCache(job.meta, result2);
                });
            });
        }

        function enrichViaSharedCache(meta, done) {
            if (!ENRICH_PROXY_URL) { done(undefined); return; }
            const url = `${ENRICH_PROXY_URL}?type=enrich&title=${encodeURIComponent(meta.title)}&artist=${encodeURIComponent(meta.artist)}`;
            fetch(url)
                .then(r => {
                    if (!r.ok) throw new Error('enrich proxy responded ' + r.status);
                    return r.json();
                })
                .then(data => done(data || null))
                .catch(() => done(undefined));
        }

        // Shared secret matching the Worker's PURGE_KEY — not treated as a
        // high-security secret (worst case someone fills the cache with
        // junk lookups), just enough to keep the write endpoint from being
        // a wide-open public button. Fire-and-forget: a failure here just
        // means this visitor's browser keeps doing the lookup itself next
        // time too, same as before this cache existed.
        const ENRICH_STORE_KEY = '70ce6e7a581f43cee202a6439864b576';

        function pushToSharedCache(meta, result) {
            if (!ENRICH_PROXY_URL) return;
            fetch(`${ENRICH_PROXY_URL}?type=enrich`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: meta.title, artist: meta.artist, key: ENRICH_STORE_KEY, data: result })
            }).catch(() => {});
        }

        function itunesLookup(meta, done) {
            // JSONP keeps this working regardless of CORS policy on itunes.apple.com
            const term = `${meta.artist} ${meta.title}`;
            const cbName = `itunesCb${++jsonpCounter}`;
            const script = document.createElement('script');
            let finished = false;
            const finish = result => {
                if (finished) return;
                finished = true;
                delete window[cbName];
                script.remove();
                done(result);
            };
            window[cbName] = data => {
                const r = (data && data.results && data.results[0]) || null;
                finish(r ? {
                    artworkUrl100: r.artworkUrl100 || null,
                    previewUrl: r.previewUrl || null,
                    trackViewUrl: r.trackViewUrl || null,
                    artistViewUrl: r.artistViewUrl || null,
                    collectionViewUrl: r.collectionViewUrl || null,
                    collectionName: r.collectionName || null,
                    // iTunes' genre is the best "niched" genre we can get
                    // without asking you to sign up for another API key
                    // (e.g. Last.fm) — it's often more specific than a
                    // station-wide label, e.g. "Bebop" or "Vocal Jazz".
                    primaryGenreName: r.primaryGenreName || null,
                    releaseDate: r.releaseDate || null
                } : null);
            };
            script.onerror = () => finish(null);
            setTimeout(() => finish(null), 15000);  // safety timeout
            script.src = `https://itunes.apple.com/search?media=music&entity=song&limit=1&term=${encodeURIComponent(term)}&callback=${cbName}`;
            document.head.appendChild(script);
        }

        function applyEnrichment(job, info) {
            const { row, coverContainer } = job;

            // Album art (prefer iTunes art; fall back to whatever KMHD gave us)
            if (info.artworkUrl100) {
                coverContainer.innerHTML = '';
                const img = document.createElement('img');
                img.src = info.artworkUrl100;
                img.alt = 'Album Cover';
                img.className = 'album-cover';
                coverContainer.appendChild(img);
            }

            // Links
            const linkify = (el, url) => {
                if (!el || !url) return;
                const a = document.createElement('a');
                a.href = url;
                a.target = '_blank';
                a.className = el.className;
                a.textContent = el.textContent;
                el.replaceWith(a);
            };
            linkify(row.querySelector('.track-title'), info.trackViewUrl);
            linkify(row.querySelector('.track-artist'), info.artistViewUrl);
            linkify(row.querySelector('.track-album'), info.collectionViewUrl);

            // Explicit "Apple Music" link alongside the other search links
            const linksRow = row.querySelector('.track-links');
            if (linksRow && info.trackViewUrl) {
                const a = document.createElement('a');
                a.href = info.trackViewUrl;
                a.target = '_blank';
                a.rel = 'noopener';
                a.textContent = 'Apple Music';
                linksRow.insertBefore(a, linksRow.firstChild);
            }

            // Genre (best available "niched" genre, from iTunes) — shown as
            // "Year - Genre" on the line under the title, or just "Genre"
            // alone when there's no year for this track.
            const genreBadge = row.querySelector('.track-genre');
            if (genreBadge && info.primaryGenreName) {
                const yearGenreLine = genreBadge.closest('.track-yeargenre');
                const hasYear = !!(yearGenreLine && yearGenreLine.querySelector('.track-year'));
                genreBadge.textContent = (hasYear ? ' - ' : '') + info.primaryGenreName;
                genreBadge.style.display = 'inline';
            }

            // 30-second preview player — disabled for now (album art only).
            // Kept here, commented out, in case we want to re-enable it later.
            /*
            if (info.previewUrl) {
                coverContainer.style.cursor = 'pointer';

                const playButton = document.createElement('div');
                playButton.className = 'play-button';
                coverContainer.appendChild(playButton);

                const pauseButton = document.createElement('div');
                pauseButton.className = 'pause-button';
                coverContainer.appendChild(pauseButton);

                let audio = null;

                coverContainer.addEventListener('click', () => {
                    if (!audio) {
                        audio = new Audio(info.previewUrl);
                        audio.addEventListener('ended', () => {
                            playButton.style.display = 'flex';
                            pauseButton.style.display = 'none';
                            row.classList.remove('highlight');
                        });
                    }
                    if (currentAudio && currentAudio !== audio) {
                        currentAudio.pause();
                        currentPlayButton.style.display = 'flex';
                        currentPauseButton.style.display = 'none';
                        currentRow.classList.remove('highlight');
                    }
                    if (audio.paused) {
                        audio.play();
                        playButton.style.display = 'none';
                        pauseButton.style.display = 'flex';
                        row.classList.add('highlight');
                    } else {
                        audio.pause();
                        playButton.style.display = 'flex';
                        pauseButton.style.display = 'none';
                        row.classList.remove('highlight');
                    }
                    currentAudio = audio;
                    currentPlayButton = playButton;
                    currentPauseButton = pauseButton;
                    currentRow = row;
                });
            }
            */
        }

        // ---------------- localStorage cache ----------------

        function cacheKey(meta) {
            return PlaylistUtils.cacheKey(CACHE_PREFIX, meta);
        }

        function cacheGet(meta) {
            try {
                const raw = localStorage.getItem(cacheKey(meta));
                if (!raw) return undefined;
                const entry = JSON.parse(raw);
                if (!entry || (Date.now() - entry.t) > CACHE_TTL_MS) {
                    localStorage.removeItem(cacheKey(meta));
                    return undefined;
                }
                return entry.d;  // may be null = known "no match"
            } catch (e) {
                return undefined;
            }
        }

        function cacheSet(meta, data) {
            try {
                localStorage.setItem(cacheKey(meta), JSON.stringify({ t: Date.now(), d: data }));
            } catch (e) {
                // Quota full: drop oldest iTunes entries and retry once
                try {
                    const keys = [];
                    for (let i = 0; i < localStorage.length; i++) {
                        const k = localStorage.key(i);
                        if (k && k.indexOf(CACHE_PREFIX) === 0) keys.push(k);
                    }
                    keys.slice(0, Math.ceil(keys.length / 2)).forEach(k => localStorage.removeItem(k));
                    localStorage.setItem(cacheKey(meta), JSON.stringify({ t: Date.now(), d: data }));
                } catch (e2) { /* give up quietly */ }
            }
        }

        // ---------------- day-playlist cache ----------------
        // Caches each day's *raw* KMHD API response in localStorage, keyed
        // by date. Both the daily view and "By Show" browsing go through
        // this, so: (a) revisiting a date, or reselecting a show, is
        // instant instead of re-hitting KMHD's API every time, and (b) "By
        // Show" and the daily view share a cache entry for any date they
        // both touch. TTL is short-ish (6 hours) because KMHD's playlist
        // API has been observed to return a day's data with hours missing
        // if fetched before that day's log has fully caught up — a short
        // TTL means a stale/incomplete cached day self-heals reasonably
        // soon rather than being stuck wrong for weeks.
        const DAY_CACHE_PREFIX = 'kmhdDay1:';
        const DAY_CACHE_TTL_MS = 6 * 60 * 60 * 1000;  // 6 hours

        function dayCacheGet(date) {
            try {
                const raw = localStorage.getItem(DAY_CACHE_PREFIX + date);
                if (!raw) return undefined;
                const entry = JSON.parse(raw);
                if (!entry || (Date.now() - entry.t) > DAY_CACHE_TTL_MS) {
                    localStorage.removeItem(DAY_CACHE_PREFIX + date);
                    return undefined;
                }
                return entry.d;
            } catch (e) {
                return undefined;
            }
        }

        function dayCacheSet(date, data) {
            try {
                localStorage.setItem(DAY_CACHE_PREFIX + date, JSON.stringify({ t: Date.now(), d: data }));
            } catch (e) {
                // Quota full: drop oldest cached days and retry once
                try {
                    const keys = [];
                    for (let i = 0; i < localStorage.length; i++) {
                        const k = localStorage.key(i);
                        if (k && k.indexOf(DAY_CACHE_PREFIX) === 0) keys.push(k);
                    }
                    keys.slice(0, Math.ceil(keys.length / 2)).forEach(k => localStorage.removeItem(k));
                    localStorage.setItem(DAY_CACHE_PREFIX + date, JSON.stringify({ t: Date.now(), d: data }));
                } catch (e2) { /* give up quietly */ }
            }
        }

        // Server-side cache (Cloudflare Worker) that sits in front of
        // KMHD's API. Shared across every visitor — the first person to
        // ask for a given date pays the slow KMHD round-trip, everyone
        // after that (until the Worker's own cache expires) gets it back
        // fast from Cloudflare's edge instead of every browser hitting
        // KMHD separately. This is on top of, not instead of, the
        // per-browser localStorage cache below (dayCacheGet/Set): that one
        // still makes a *repeat visit from the same browser* instant with
        // zero network round-trip at all.
        const KMHD_PROXY_URL = 'https://kmhd-playlist-cache.teedlo.workers.dev/';

        function directKmhdUrl(date) {
            return `https://www.kmhd.org/pf/api/v3/content/fetch/playlist?query=${encodeURIComponent(JSON.stringify({ day: date }))}`;
        }

        // Fetches one day's playlist, via cache when possible. Always
        // resolves (never rejects) — network/parse failures resolve to [].
        function fetchDayPlaylist(date) {
            const cached = dayCacheGet(date);
            if (cached !== undefined) return Promise.resolve(cached);

            const proxyUrl = KMHD_PROXY_URL ? `${KMHD_PROXY_URL}?day=${encodeURIComponent(date)}` : null;
            const request = proxyUrl
                // Prefer the shared server-side cache; if it's ever down,
                // misconfigured, or just not set up, fall straight through
                // to KMHD directly so the page still works either way.
                ? fetch(proxyUrl).then(r => {
                    if (!r.ok) throw new Error('proxy responded ' + r.status);
                    return r.json();
                }).catch(() => fetch(directKmhdUrl(date)).then(r => r.json()))
                : fetch(directKmhdUrl(date)).then(r => r.json());

            return request
                .then(data => {
                    const arr = Array.isArray(data) ? data : [];
                    dayCacheSet(date, arr);
                    return arr;
                })
                .catch(() => []);
        }

        // ---------------- date handling ----------------

        function getYesterday() {
            const date = new Date();
            date.setDate(date.getDate() - 1);
            return date.toISOString().split('T')[0];
        }

        function updatePageHeader(date) {
            const dateObj = new Date(date + 'T00:00:00');  // parse as local time (no off-by-one)
            const today = new Date();
            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            let formattedDate = dateObj.toLocaleDateString('en-US', options);
            if (dateObj.getFullYear() !== today.getFullYear()) {
                formattedDate += `, ${dateObj.getFullYear()}`;
            }
            const header = document.getElementById('pageHeader');
            header.innerHTML = '';
            header.appendChild(document.createTextNode('KMHD Playlist for '));
            const a = document.createElement('a');
            a.href = `?date=${date}`;
            a.textContent = formattedDate;
            header.appendChild(a);
        }

        // ---------------- "By Show" browsing ----------------
        // KMHD doesn't offer a per-show archive API. Instead, we know each
        // show's recurring weekly time slot (shows-schedule.js, hand-
        // transcribed from kmhd.org/schedule/), so we generate the list of
        // past dates that slot has aired on and re-use the existing per-day
        // playlist API for each one, filtering to just that show's window.

        const SHOW_BATCH_SIZE = 6;   // occurrences fetched per slot per "page"
        let currentShow = null;      // the show currently being browsed, or null
        let showBatchesLoaded = 0;   // how many SHOW_BATCH_SIZE pages have been fetched so far
        let showDatesShown = null;   // Set of dates already rendered, to avoid duplicates across slots
        let showAllItems = [];       // { date, item } accumulated so far, so switching sort can re-render without refetching

        function populateShowSelect() {
            const select = document.getElementById('showSelect');
            if (typeof KmhdShows === 'undefined') return;
            KmhdShows.uniqueShows().forEach(show => {
                const opt = document.createElement('option');
                opt.value = show.name;
                opt.textContent = show.host ? `${show.name} (${show.host})` : show.name;
                select.appendChild(opt);
            });
        }

        function showByName(name) {
            if (typeof KmhdShows === 'undefined') return null;
            return KmhdShows.uniqueShows().find(s => s.name === name) || null;
        }

        function startShowHistory(name) {
            const show = showByName(name);
            if (!show) return;
            document.getElementById('showSelect').value = name;   // keep the dropdown in sync, e.g. when jumped to via the Headnod Show button
            currentShow = show;
            showBatchesLoaded = 0;
            showDatesShown = new Set();
            showAllItems = [];
            showFetchToken++;          // invalidate any still-in-flight fetches from a previous show/view
            showFetchInFlight = false;

            document.getElementById('dateForm').style.display = 'none';
            document.getElementById('backToDate').style.display = 'block';
            document.querySelector('#playlistTable tbody').innerHTML = '';
            document.getElementById('loadMoreWrap').style.display = 'none';
            document.getElementById('loadMoreButton').disabled = false;

            const header = document.getElementById('pageHeader');
            header.textContent = show.host ? `${show.name} — hosted by ${show.host}` : show.name;

            loadMoreShowHistory();
        }

        function backToDateView() {
            currentShow = null;
            showFetchToken++;          // invalidate any still-in-flight "By Show" fetches
            showFetchInFlight = false;
            document.getElementById('dateForm').style.display = 'flex';
            document.getElementById('backToDate').style.display = 'none';
            document.getElementById('loadMoreWrap').style.display = 'none';
            document.getElementById('showSelect').value = '';
            const date = document.getElementById('dateInput').value || getYesterday();
            fetchPlaylist(date);
        }

        // True if the browser has the up-to-date playlist-utils.js loaded.
        // Guards against a stale *cached* copy from before "By Show" existed
        // — without this check, calling a function the cached copy doesn't
        // have yet throws silently and the page just renders blank with no
        // loading spinner or error message, which is confusing to debug.
        // Cache-busted script URLs (see the <script> tags near the top of
        // this file) should prevent this going forward, but this check
        // keeps it from ever failing silently again regardless.
        function showBrowsingSupported() {
            return typeof PlaylistUtils !== 'undefined'
                && typeof PlaylistUtils.pastWeekdayDates === 'function'
                && typeof PlaylistUtils.trackInSlot === 'function'
                && typeof KmhdShows !== 'undefined';
        }

        let showFetchInFlight = false;   // re-entrancy guard: ignore triggers while a batch is loading
        // showFetchToken doubles as a *shared* "which view is current" token:
        // it's bumped whenever the user switches views at all (startShowHistory
        // for -> By Show, backToDateView for -> daily view), and both
        // fetchPlaylist() and loadMoreShowHistory() capture it before starting
        // a fetch and re-check it before touching the DOM. Whichever view the
        // user is on *now* wins, even if an older fetch from the view they
        // left resolves later — fixes a race where quickly switching views
        // let a stale fetchPlaylist() response overwrite the By Show view
        // (or vice versa).
        let showFetchToken = 0;
        function viewToken() { return showFetchToken; }

        // Inserts a date section (header row + that date's tracks, in
        // chronological order) into the table at the right spot to keep
        // the whole list sorted newest-date-first, even though dates can
        // now arrive out of order (cached dates resolve instantly, live
        // fetches trickle in later).
        function insertShowDateSection(date, items) {
            const tbody = document.querySelector('#playlistTable tbody');
            const dateObj = new Date(date + 'T00:00:00');
            const dateHeaderRow = document.createElement('tr');
            const dateHeaderCell = document.createElement('td');
            dateHeaderCell.colSpan = 3;
            dateHeaderCell.className = 'date-header';
            dateHeaderCell.dataset.date = date;
            dateHeaderCell.textContent = dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
            dateHeaderRow.appendChild(dateHeaderCell);

            const frag = document.createDocumentFragment();
            frag.appendChild(dateHeaderRow);
            items
                .slice()
                .sort((a, b) => {
                    const da = PlaylistUtils.trackStartDate(a);
                    const db = PlaylistUtils.trackStartDate(b);
                    return (da ? da.getTime() : 0) - (db ? db.getTime() : 0);
                })
                .forEach(item => frag.appendChild(buildTrackRow(item)));

            // Find the first existing date-header that's older than this
            // one, and insert before it; otherwise append at the end.
            const existingHeaders = Array.from(tbody.querySelectorAll('.date-header'));
            const insertBeforeHeader = existingHeaders.find(h => h.dataset.date < date);
            if (insertBeforeHeader) {
                tbody.insertBefore(frag, insertBeforeHeader.closest('tr'));
            } else {
                tbody.appendChild(frag);
            }
        }

        // Rebuilds the whole By Show table from everything loaded so far
        // (showAllItems), for whichever sort is currently active. Used both
        // when the sort control changes and (in year mode) each time a new
        // batch of dates resolves, since year-grouping mixes tracks across
        // dates and can't be appended incrementally the way date sections can.
        function rerenderShowFromAccumulated() {
            const tbody = document.querySelector('#playlistTable tbody');
            tbody.innerHTML = '';
            if (currentSort === 'year') {
                renderGroupedByYear(tbody, showAllItems.map(entry => entry.item));
                return;
            }
            const byDate = {};
            showAllItems.forEach(entry => {
                (byDate[entry.date] = byDate[entry.date] || []).push(entry.item);
            });
            Object.keys(byDate)
                .sort((a, b) => b.localeCompare(a))   // newest date first
                .forEach(date => insertShowDateSection(date, byDate[date]));
        }

        // Fetches the next batch of past occurrences for the show currently
        // being browsed (SHOW_BATCH_SIZE weeks further back per slot the
        // show airs in). Each date renders as soon as ITS fetch resolves
        // (via fetchDayPlaylist's cache when available — instant — or a
        // live network call) rather than waiting for the whole batch, so
        // one slow date doesn't stall everything else. Re-selecting a show
        // or revisiting dates you've already loaded is fast because
        // fetchDayPlaylist caches each day's raw response in localStorage.
        function loadMoreShowHistory() {
            if (!currentShow || showFetchInFlight) return;

            if (!showBrowsingSupported()) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('loadMoreWrap').style.display = 'none';
                document.getElementById('error').textContent = 'This page needs to reload to pick up a recent update before "By Show" will work. Please refresh the page (or press Ctrl/Cmd+Shift+R) and try again.';
                document.getElementById('error').style.display = 'block';
                return;
            }

            const token = showFetchToken;
            let candidates;
            try {
                const todayIso = new Date().toISOString().split('T')[0];
                const startWeek = showBatchesLoaded * SHOW_BATCH_SIZE;

                // Build the list of candidate dates for this batch, across all
                // of the show's weekly slots (most shows have one; a few, like
                // Positive Vibrations, air most days).
                candidates = [];
                currentShow.slots.forEach(slot => {
                    const dates = PlaylistUtils.pastWeekdayDates(slot.weekday, showBatchesLoaded * SHOW_BATCH_SIZE + SHOW_BATCH_SIZE, todayIso)
                        .slice(startWeek);
                    dates.forEach(date => candidates.push({ date, slot }));
                });
                candidates = candidates.filter(c => !showDatesShown.has(c.date));
                showBatchesLoaded++;
            } catch (e) {
                console.error('Error building By Show date range:', e);
                document.getElementById('error').textContent = 'Something went wrong loading this show’s history. Please refresh the page and try again.';
                document.getElementById('error').style.display = 'block';
                return;
            }

            showFetchInFlight = true;
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('loadMoreButton').disabled = true;
            document.getElementById('loadMoreWrap').style.display = 'block';

            let remaining = candidates.length;
            let anyRendered = false;
            if (remaining === 0) {
                showFetchInFlight = false;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('loadMoreButton').disabled = false;
                return;
            }

            candidates.forEach(c => {
                fetchDayPlaylist(c.date).then(data => {
                    if (token !== showFetchToken) return;  // a different show was selected meanwhile — drop this result
                    const items = data.filter(item => PlaylistUtils.trackInSlot(item, c.slot));
                    if (items.length > 0 && !showDatesShown.has(c.date)) {
                        showDatesShown.add(c.date);
                        anyRendered = true;
                        items.forEach(item => showAllItems.push({ date: c.date, item }));
                        if (currentSort === 'year') {
                            // Year-grouping mixes tracks across dates, so it
                            // can't be appended incrementally the way date
                            // sections can — rebuild from everything loaded
                            // so far instead.
                            rerenderShowFromAccumulated();
                        } else {
                            insertShowDateSection(c.date, items);
                        }
                    }
                }).catch(() => { /* fetchDayPlaylist already resolves [] on failure; nothing else to do */ }).finally(() => {
                    if (token !== showFetchToken) return;
                    remaining--;
                    if (remaining === 0) {
                        showFetchInFlight = false;
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('loadMoreButton').disabled = false;
                        if (!anyRendered && showDatesShown.size === 0) {
                            document.getElementById('error').textContent = `No playlist data found yet for ${currentShow.name}. Try loading earlier episodes.`;
                            document.getElementById('error').style.display = 'block';
                        }
                    }
                });
            });
        }

        // Jumps straight to a specific show, bypassing the dropdown — used
        // by the "★ Headnod Show" quick-jump button.
        const HEADNOD_SHOW_NAME = 'The Headnod Show';

        function setupShowBrowsing() {
            populateShowSelect();
            document.getElementById('showSelect').addEventListener('change', e => {
                if (e.target.value && !showFetchInFlight) startShowHistory(e.target.value);
            });
            document.getElementById('headnodButton').addEventListener('click', () => {
                if (!showFetchInFlight) startShowHistory(HEADNOD_SHOW_NAME);
            });
            document.getElementById('backToDateLink').addEventListener('click', backToDateView);
            document.getElementById('loadMoreButton').addEventListener('click', loadMoreShowHistory);
        }

        function setupSort() {
            document.getElementById('sortSelect').addEventListener('change', e => {
                currentSort = e.target.value;
                if (currentShow) {
                    rerenderShowFromAccumulated();
                } else {
                    renderPlaylist(lastDailyData);
                }
            });
        }

        // ---------------- dark mode toggle ----------------
        // Defaults to the visitor's OS/browser preference (via the
        // prefers-color-scheme CSS media query); the button lets them
        // override that manually, and the override is remembered.

        function systemPrefersDark() {
            return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        }

        function currentTheme() {
            const saved = (() => { try { return localStorage.getItem('theme'); } catch (e) { return null; } })();
            if (saved === 'dark' || saved === 'light') return saved;
            return systemPrefersDark() ? 'dark' : 'light';
        }

        function applyThemeButtonLabel() {
            const btn = document.getElementById('themeToggle');
            btn.textContent = currentTheme() === 'dark' ? '☀️' : '🌙';
        }

        function setupThemeToggle() {
            applyThemeButtonLabel();
            document.getElementById('themeToggle').addEventListener('click', () => {
                const next = currentTheme() === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                try { localStorage.setItem('theme', next); } catch (e) { /* ignore */ }
                applyThemeButtonLabel();
            });
        }

        function enableSubmitButton() {
            const dateInput = document.getElementById('dateInput');
            const submitButton = document.getElementById('submitButton');
            const initialValue = dateInput.value;

            dateInput.addEventListener('change', () => {
                if (dateInput.value !== initialValue) {
                    submitButton.disabled = false;
                } else {
                    submitButton.disabled = true;
                }
            });
        }

        // Check if the page loaded with a date parameter and fetch playlist if true
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            let date = urlParams.get('date');
            if (!date) {
                date = getYesterday();
            }
            const dateInput = document.getElementById('dateInput');
            dateInput.value = date;
            fetchPlaylist(date);
            enableSubmitButton();
            setupThemeToggle();
            setupShowBrowsing();
            setupSort();
        });
    </script>
