name: Deploy to DreamHost

# Push to main -> run unit tests -> publish to teedlo.com/kmhd/.
# Tests gate the deploy: if `node --test` fails, nothing is uploaded.
#
# Also callable from another workflow (enrich.yml, which commits new
# Apple Music link files with the Actions token; such pushes don't fire
# "on: push", so it calls this directly and passes the commit to deploy).
#
# Repository secrets required:
#   DEPLOY_KEY     private half of ~/.ssh/dreamhost_deploy
#   SFTP_HOST      teedlo.com
#   SFTP_USERNAME  DreamHost shell user

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        description: 'Commit or branch to deploy (defaults to the triggering commit)'
        type: string
        required: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        run: node --test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Unlike the other teedlo.com repos, this one has no site/ directory --
      # the publishable files sit at the repo root alongside tests, package.json
      # and CLAUDE.md. So the deploy names its files explicitly rather than
      # syncing a directory. Add new published files here. `enrich` is the
      # directory of per-day Apple Music link files (see scripts/build-enrich.js);
      # rsync copies it whole, as /kmhd/enrich/. headnod-tracks.json is the
      # merged, precomputed Headnod tracklist (see
      # scripts/build-headnod-tracklist.js). relations.json is the
      # precomputed samples/sampled-in/other-versions data (see
      # scripts/build-relations.js) — each must already be committed before
      # this list is extended to include it, or rsync fails looking for a
      # file that isn't in the checkout yet.
      FILES: .htaccess index.html headnod.html headnod-tracklist.html headnod-stats.html headnod-tracks.json relations.json playlist-utils.js shows-schedule.js enrich
      REMOTE_DIR: teedlo.com/kmhd/
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install deploy key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the server's host keys rather than scanning for them at run time.
          # ssh-keyscan opens three rapid connect/disconnect cycles, which is the
          # most fragile thing to run against a host that is already dropping us
          # (see the Deploy step). Pinning also beats trust-on-first-use, since
          # keyscan believes whatever answers.
          # PUBLIC keys for teedlo.com; refresh with `ssh-keyscan -T 15 teedlo.com`
          # if the server is rebuilt -- ssh fails loudly on a mismatch.
          {
            printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKtlB1X+ASqyQoF5yQRqzSjqBe63rPEVisl3cQ6kS4fS\n' "${{ secrets.SFTP_HOST }}"
            printf '%s ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBD8bf6mZtBadyRV8ryn6vszQC6swhYxSMqX2cKWh8VMMd0q3bGNqqyT09RE7X++LUEbHD/wnC8ELcoC2UFLEDn0=\n' "${{ secrets.SFTP_HOST }}"
          } >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # No --delete: the file list is explicit, and /1/ also holds a stray site/
      # directory left by an old sftp nesting bug that is not this repo's to remove.
      # rsync does not create a missing destination directory, and /kmhd/
      # is new, so ensure it exists before the first deploy lands.
      - name: Ensure remote directory exists
        run: |
          # Same DreamHost SSH resets as the Deploy step; mkdir -p is idempotent.
          delay=15
          for attempt in 1 2 3 4; do
            if \
              ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
                "${{ secrets.SFTP_USERNAME }}@${{ secrets.SFTP_HOST }}" \
                'mkdir -p teedlo.com/kmhd'; then exit 0; fi
            echo "attempt $attempt failed; retrying in ${delay}s"
            sleep "$delay"; delay=$((delay * 2))
          done
          echo "::error::deploy host unreachable after 4 attempts"
          exit 1

      - name: Deploy
        run: |
          # DreamHost intermittently resets SSH from GitHub runners
          # ("Connection closed/reset by 173.236.194.30 port 22", exit 255) --
          # seen across every teedlo repo on 2026-09-19, interleaved with
          # successes minutes apart. Nothing is wrong with the key or the host,
          # and the next attempt almost always works. rsync is idempotent, so
          # retrying is safe -- with or without --delete. `if` keeps a failure
          # from tripping `bash -e` before the retry can run.
          delay=15
          for attempt in 1 2 3 4; do
            if \
              rsync -az --itemize-changes \
                -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4" \
                $FILES \
                "${{ secrets.SFTP_USERNAME }}@${{ secrets.SFTP_HOST }}:$REMOTE_DIR"; then exit 0; fi
            echo "attempt $attempt failed; retrying in ${delay}s"
            sleep "$delay"; delay=$((delay * 2))
          done
          echo "::error::deploy host unreachable after 4 attempts"
          exit 1
