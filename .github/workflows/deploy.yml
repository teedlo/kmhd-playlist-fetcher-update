name: Deploy to DreamHost

# Push to main -> run unit tests -> publish to teedlo.com/1/.
# Tests gate the deploy: if `node --test` fails, nothing is uploaded.
#
# Repository secrets required:
#   DEPLOY_KEY     private half of ~/.ssh/dreamhost_deploy
#   SFTP_HOST      teedlo.com
#   SFTP_USERNAME  DreamHost shell user

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        run: node --test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Unlike the other teedlo.com repos, this one has no site/ directory --
      # the publishable files sit at the repo root alongside tests, package.json
      # and CLAUDE.md. So the deploy names its files explicitly rather than
      # syncing a directory. Add new published files here.
      FILES: .htaccess index.html headnod.html playlist-utils.js shows-schedule.js itunes-cache.json
      REMOTE_DIR: teedlo.com/1/
    steps:
      - uses: actions/checkout@v5

      - name: Install deploy key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SFTP_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # No --delete: the file list is explicit, and /1/ also holds a stray site/
      # directory left by an old sftp nesting bug that is not this repo's to remove.
      - name: Deploy
        run: |
          rsync -az --itemize-changes \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            $FILES \
            "${{ secrets.SFTP_USERNAME }}@${{ secrets.SFTP_HOST }}:$REMOTE_DIR"
