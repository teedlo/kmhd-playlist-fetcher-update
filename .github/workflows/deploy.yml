name: Deploy to DreamHost

# Runs automatically every time you push to the main branch.
# Runs the unit tests first; if they fail, the site is NOT deployed.
# Uploads index.html (and its sibling playlist-utils.js) to the /1/
# folder on teedlo.com via SFTP.
#
# Requires three repository secrets (Settings → Secrets and variables → Actions):
#   SFTP_HOST      e.g. teedlo.com
#   SFTP_USERNAME  your DreamHost SFTP/shell username
#   SFTP_PASSWORD  that user's password
#
# If your DreamHost web directory isn't /home/<username>/teedlo.com,
# adjust remote_path below to match.

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # also lets you trigger it manually from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: node --test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # wlixcc/SFTP-Deploy-Action does `sftp put -r <local_path>`, which
      # (like plain `sftp put -r`) creates a same-named subdirectory at the
      # destination rather than uploading contents directly. Pointing
      # local_path at a *folder* (e.g. "./site") therefore lands files at
      # /1/site/... instead of /1/... — learned this the hard way on the
      # first run with multiple files. Uploading each file individually
      # (local_path: a single file) avoids that nesting.
      - name: Upload index.html via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          sftp_only: true
          local_path: './index.html'
          remote_path: '/home/${{ secrets.SFTP_USERNAME }}/teedlo.com/1'

      - name: Upload playlist-utils.js via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          sftp_only: true
          local_path: './playlist-utils.js'
          remote_path: '/home/${{ secrets.SFTP_USERNAME }}/teedlo.com/1'

      - name: Upload itunes-cache.json via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          sftp_only: true
          local_path: './itunes-cache.json'
          remote_path: '/home/${{ secrets.SFTP_USERNAME }}/teedlo.com/1'
