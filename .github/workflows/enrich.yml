name: Update Apple Music links

# Every few hours: look up any track KMHD has played since the last run,
# write the day's enrich/YYYY-MM-DD.json, commit it, and deploy. That is
# what keeps the pages' Apple Music links instant: the browser never has
# to look a track up itself unless it was played since the last run here.
#
# scripts/build-enrich.js only looks up tracks it has never seen, so a run
# that finds nothing new changes nothing and commits nothing. The default
# arguments rebuild today, yesterday and the day before (which also catches
# KMHD's playlist log filling in late for a day that already had a file),
# then spend the rest of a 900-lookup budget filling in any day of the
# last 120 that has no file yet, newest first. At iTunes' rate limit that
# is up to about an hour per run, so a few days of runs fill the whole
# window on their own; after that each run is a couple of minutes.
#
# To run more or less often, change the cron line below. To build specific
# dates by hand, use "Run workflow" with e.g. "--from 2026-01-01 --to
# 2026-03-31" or "--weekday 5 --weeks 52" (a year of Fridays for the
# Headnod page).
#
# The commit is made with the workflow's own token, which deliberately does
# NOT trigger the "on: push" deploy (GitHub's loop protection), so this
# workflow calls deploy.yml directly when something changed.

on:
  schedule:
    - cron: '23 */6 * * *'     # every 6 hours (UTC), at :23 past the hour
  workflow_dispatch:
    inputs:
      args:
        description: 'Arguments for scripts/build-enrich.js'
        default: '--days 3 --backfill 120 --max-lookups 900'
        required: false

permissions:
  contents: write

concurrency:
  group: enrich
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Look up new tracks
        env:
          ARGS: ${{ inputs.args || '--days 3 --backfill 120 --max-lookups 900' }}
        run: node scripts/build-enrich.js $ARGS

      - name: Commit any changes
        id: commit
        run: |
          git add enrich
          if git diff --cached --quiet; then
            echo "Nothing new."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name=teedlo -c user.email=213245817+teedlo@users.noreply.github.com \
            commit -m "Update Apple Music links ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # Someone may have pushed to main in the meantime: rebase and retry.
          pushed=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then pushed=true; break; fi
            git pull --rebase origin main || exit 1
            sleep 5
          done
          if [ "$pushed" != true ]; then
            echo "::error::Could not push to main after 3 attempts"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.build.outputs.sha }}
    secrets: inherit
