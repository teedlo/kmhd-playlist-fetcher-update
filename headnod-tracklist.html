<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Every Headnod Track — The Headnod Show</title>
    <script>
        // Applied before first paint so there's no flash of the wrong theme.
        // Shares the 'theme' localStorage key with the other pages, so
        // toggling dark mode anywhere carries over here too.
        (function () {
            try {
                const saved = localStorage.getItem('theme');
                if (saved === 'dark' || saved === 'light') {
                    document.documentElement.setAttribute('data-theme', saved);
                }
            } catch (e) { /* localStorage unavailable; fall back to OS preference via CSS */ }
        })();
    </script>
    <style>
        /* Same palette as headnod.html (WCAG AAA contrast, larger base font). */
        :root {
            --bg: #fff;
            --fg: #333;
            --header-bg: #eee;
            --border: #ddd;
            --placeholder-bg: #eee;
            --link: #0a4fbf;
            --muted: #545861;
            --error: #a00;
            --badge-bg: #eef3fb;
            --badge-fg: #345;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #16181c;
                --fg: #e2e2e2;
                --header-bg: #23262b;
                --border: #33363c;
                --placeholder-bg: #23262b;
                --link: #6cb2ff;
                --muted: #b9bcc2;
                --error: #ff8080;
                --badge-bg: #1f2a38;
                --badge-fg: #9cc0e8;
            }
        }
        :root[data-theme="dark"] {
            --bg: #16181c;
            --fg: #e2e2e2;
            --header-bg: #23262b;
            --border: #33363c;
            --placeholder-bg: #23262b;
            --link: #6cb2ff;
            --muted: #b9bcc2;
            --error: #ff8080;
            --badge-bg: #1f2a38;
            --badge-fg: #9cc0e8;
        }
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            font-size: 18px;
            line-height: 1.5;
            margin: 0;
            padding: 20px 16px 40px;
            color: var(--fg);
            background: var(--bg);
        }
        .wrap { max-width: 60em; margin: 0 auto; }
        header.page { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 2.1em; margin: 0 0 6px; }
        .tagline { margin: 0 0 4px; font-size: 1.05em; }
        .subline { margin: 0 0 16px; font-size: 0.95em; color: var(--muted); }
        nav.page {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        a { color: var(--link); }
        button {
            font-family: inherit;
            font-size: 1em;
            padding: 10px 16px;
            cursor: pointer;
            background: var(--header-bg);
            color: var(--fg);
            border: 1px solid var(--border);
            border-radius: 6px;
        }
        button:disabled { opacity: 0.6; cursor: default; }
        .back-link {
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--header-bg);
            text-decoration: none;
        }

        /* ---------------- track rows (same shape as headnod.html) ------- */
        table.tracks { width: 100%; border-collapse: collapse; }
        table.tracks td {
            border-top: 1px solid var(--border);
            padding: 12px 8px;
            text-align: left;
            vertical-align: top;
        }
        .album-cover-container { position: relative; display: block; width: 60px; height: 60px; }
        .album-cover, .album-placeholder { width: 100%; height: 100%; border-radius: 4px; }
        .album-placeholder { background-color: var(--placeholder-bg); }
        .start-time {
            white-space: nowrap;
            width: 1%;
            text-align: right;
            color: var(--muted);
            font-size: 0.95em;
        }
        .played-date {
            font-size: 0.85em;
            font-style: italic;
        }
        .column-details { width: 99%; word-wrap: break-word; }
        .bold { font-weight: bold; }
        .track-title { font-size: 1.05em; }
        .track-artist { font-size: 1em; }
        .small { font-size: 0.9em; font-style: italic; color: var(--muted); }
        .track-line { margin-top: 3px; }
        .track-links {
            margin-top: 9px;
            font-size: 0.85em;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
        }
        .track-links a { white-space: nowrap; padding: 4px 0; }

        /* ---------------- sort control + group headers ---------------- */
        .track-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px 20px;
            margin: 0 0 18px;
        }
        .track-controls label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95em;
            color: var(--muted);
        }
        .track-controls select {
            font-family: inherit;
            font-size: 1em;
            padding: 9px 12px;
            max-width: 18em;
            background: var(--header-bg);
            color: var(--fg);
            border: 1px solid var(--border);
            border-radius: 6px;
        }
        table.tracks tr.group-header td {
            background: var(--header-bg);
            font-weight: bold;
            text-align: center;
            padding: 8px;
            cursor: pointer;
            user-select: none;
        }
        table.tracks tr.group-header td::before {
            content: '\25bc';
            display: inline-block;
            font-size: 0.75em;
            margin-right: 8px;
        }
        table.tracks tbody.track-group.collapsed tr.group-header td::before {
            content: '\25b6';
        }
        table.tracks tbody.track-group.collapsed tr.track-row {
            display: none;
        }
        table.tracks tr.group-header:focus-visible td {
            outline: 2px solid var(--link);
            outline-offset: -2px;
        }
        .bucket-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 0 0 18px;
        }
        .bucket-nav a {
            display: inline-block;
            padding: 6px 12px;
            background: var(--badge-bg);
            color: var(--badge-fg);
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9em;
        }
        .bucket-nav a:hover,
        .bucket-nav a:focus-visible {
            outline: 2px solid var(--link);
            outline-offset: 1px;
        }
        .bucket-nav a[aria-current="page"] {
            background: var(--link);
            color: var(--bg);
        }
        #summary {
            text-align: center;
            font-size: 0.9em;
            color: var(--muted);
            margin: 0 0 16px;
        }

        #loading, #error { text-align: center; padding: 12px; }
        #error { color: var(--error); display: none; }
        footer { margin-top: 32px; text-align: center; font-size: 0.85em; color: var(--muted); }
        footer a { color: var(--muted); }

        @media (max-width: 600px) {
            body { padding: 14px 10px 30px; }
            table.tracks td { padding: 10px 4px; }
        }
    </style>
</head>
<body>
<div class="wrap">

    <header class="page">
        <h1>Every Headnod Track</h1>
        <p class="tagline">Every track logged across every Friday we have data for &mdash; one list, not one episode at a time.</p>
        <p class="subline" id="rangeLine">Loading&hellip;</p>
        <nav class="page">
            <a class="back-link" href="headnod.html">&larr; The Headnod Show</a>
            <a class="back-link" href="./">All KMHD playlists</a>
            <button type="button" id="themeToggle" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
        </nav>
    </header>

    <div id="loading">Loading tracks&hellip;</div>
    <div id="error"></div>

    <div class="track-controls">
        <label>Sort
            <select id="sortSelect" aria-label="Sort all tracks">
                <option value="date" selected>by date played (newest first)</option>
                <option value="year">by year released (oldest first)</option>
                <option value="artist">by artist (A&ndash;Z)</option>
            </select>
        </label>
        <label>Year played
            <select id="yearFilterSelect" aria-label="Filter by year played">
                <option value="" selected>All years</option>
            </select>
        </label>
        <button type="button" id="collapseToggle" disabled>Collapse all</button>
    </div>

    <nav class="bucket-nav" id="bucketNav" aria-label="Browse artists by letter" hidden></nav>

    <div id="summary" style="display:none"></div>

    <main id="allTracksWrap"></main>

    <footer>
        Tracklists from <a href="https://www.kmhd.org/playlist/" target="_blank" rel="noopener">KMHD</a>.
        Album art &amp; links from <a href="https://performance-partners.apple.com/search-api" target="_blank" rel="noopener">iTunes Search</a>.
    </footer>

</div>

<!-- Cache-busting query param: bump whenever playlist-utils.js changes (see
     the same note in index.html and headnod.html — a stale cached copy
     silently breaks any function the old copy doesn't have yet). This page
     doesn't need shows-schedule.js: slot filtering already happened when
     headnod-tracks.json was built. -->
<script src="playlist-utils.js?v=20260915"></script>
<script>
    // ------------------------------------------------------------------
    // Every track logged on The Headnod Show, across every Friday we have
    // data for — one continuous, sortable list rather than one episode's
    // tracklist at a time.
    //
    // Unlike headnod.html and index.html, this page does not talk to KMHD
    // or iTunes at all: it fetches one precomputed file, headnod-tracks.json
    // (built daily by scripts/build-headnod-tracklist.js, which merges every
    // known Friday's playlist with whatever enrich/YYYY-MM-DD.json already
    // knows about each track). That file already carries each track's
    // Apple Music link/art/genre data, so there is no live lookup queue
    // here — just PlaylistUtils.expandEntry() turning the compact fields
    // back into URLs, same as every other page's enrich/ data.
    // ------------------------------------------------------------------

    let currentSort = 'date';   // 'date' | 'year' | 'artist'
    let yearFilter = '';        // '' = all years, else a 4-digit year the track was PLAYED (not released)
    let allEntries = [];        // [{ date, item }], every known track play

    let bucketFilter = null;        // null, or { index, label } from ?bucket= — see applyUrlParams
    let artistBucketPlan = null;    // computed once after load from the FULL dataset — see computeArtistBucketPlan

    // Alphabet-bucket links for the artist sort: fixed-width letter ranges
    // (A-F, G-M, ...) would leave some buckets nearly empty and others with
    // hundreds of artists, since real artist names cluster unevenly across
    // the alphabet. Splitting evenly by artist COUNT instead, then labeling
    // each bucket by its actual first/last letter, gives ranges like "A-C"
    // then "D-R" that reflect where the artists really are.
    const ARTIST_BUCKET_MIN_TOTAL = 15;    // fewer artists than this: buckets aren't worth it
    const ARTIST_BUCKET_TARGET_SIZE = 30;  // aim for roughly this many artists per bucket
    const ARTIST_BUCKET_MIN_COUNT = 3;
    const ARTIST_BUCKET_MAX_COUNT = 12;

    function friendlyDate(isoDate) {
        const d = new Date(isoDate + 'T00:00:00');
        return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    }

    // Short form for the per-row date next to the air time: the same track
    // can air on more than one Friday, and with only a time shown two plays
    // of one song look like a duplicate rather than two separate airings.
    function shortDate(isoDate) {
        const d = new Date(isoDate + 'T00:00:00');
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    // ---------------- sorting the merged list ----------------
    // Mirrors the per-episode sort in headnod.html: year sort is oldest
    // first with unknowns last; the default keeps newest-Friday-first
    // (matching every other list on this site), with each Friday's own
    // tracks in the order they aired.

    function entryTime(entry) {
        const d = PlaylistUtils.trackStartDate(entry.item);
        return d ? d.getTime() : 0;
    }

    function entryYear(entry) {
        return yearOf(entry.item);
    }

    function entryArtist(entry) {
        return PlaylistUtils.mapItemFields(entry.item).artist || '';
    }

    // Two artist name strings, empty ("unknown") sorting last. Shared by
    // compareEntries' artist branch and computeArtistBucketPlan below, so
    // both agree exactly on ordering — a real bug during this feature's
    // development came from those two computations disagreeing at the
    // edges (a string-range check handled non-Latin-script names and the
    // empty-artist case differently than the sort itself did).
    function compareArtists(aa, ab) {
        if (!aa || !ab) return aa === ab ? 0 : (aa ? -1 : 1);
        // 'accent' (case-insensitive, diacritic-sensitive), not 'base'
        // (which also folds diacritics): groupKey below only lowercases
        // the label, so two artists differing solely by an accent (e.g.
        // "Gábor Szabó" vs. "Gabor Szabo") are still distinct groups —
        // treating them as equal here would interleave the two spellings
        // by date instead of keeping each artist's tracks contiguous,
        // splitting it into two separate, non-adjacent group headers.
        return aa.localeCompare(ab, undefined, { sensitivity: 'accent' });
    }

    function compareEntries(a, b) {
        if (currentSort === 'year') {
            const ya = entryYear(a), yb = entryYear(b);
            if (ya !== yb) {
                if (ya == null) return 1;
                if (yb == null) return -1;
                return ya - yb;
            }
            return entryTime(a) - entryTime(b);
        }
        if (currentSort === 'artist') {
            const cmp = compareArtists(entryArtist(a), entryArtist(b));
            if (cmp !== 0) return cmp;
            if (a.date !== b.date) return a.date < b.date ? 1 : -1;   // newest date first within an artist
            return entryTime(a) - entryTime(b);
        }
        if (a.date !== b.date) return a.date < b.date ? 1 : -1;   // newest date first
        return entryTime(a) - entryTime(b);                        // that date's own air order
    }

    function groupLabel(entry) {
        if (currentSort === 'year') {
            const y = entryYear(entry);
            return y ? String(y) : 'Unknown year';
        }
        if (currentSort === 'artist') {
            return entryArtist(entry) || 'Unknown artist';
        }
        return friendlyDate(entry.date);
    }

    // Same grouping as groupLabel, but case-normalized for artist sort so
    // KMHD's own occasional case inconsistency for one artist (e.g.
    // "Weather Report" vs. "weather report") doesn't split them into two
    // alternating groups — the whole point of this sort is one group per
    // artist.
    function groupKey(entry) {
        return currentSort === 'artist' ? groupLabel(entry).toLowerCase() : groupLabel(entry);
    }

    // Grouped by artist or year, a single group can run to hundreds of rows
    // (every Friday one artist ever played on) with dozens of groups in the
    // page — expanding all of them by default is what made the page take
    // forever to scroll. Collapse those two modes' groups by default (one
    // click each to open); date mode's groups are just one Friday's ~6-10
    // tracks, so it stays fully expanded as before.
    function collapseGroupsByDefault() {
        return currentSort !== 'date';
    }

    // ---------------- artist buckets ----------------
    // A divider row buried in a 3,000-artist list only tells you where a
    // section starts once you've already scrolled past everything before
    // it, and an in-page anchor jump still leaves every one of those 3,000
    // rows in the DOM. So each bucket is a real page: a plain link with
    // ?sort=artist&bucket=N, matching the ?date= deep-link pattern this
    // site already uses (see headnod.html's fridayLinkTarget and this
    // page's own headnod.html?date= links below).
    //
    // Buckets are matched by POSITION, not by comparing artist-name
    // strings: "Unknown artist" sorts last via a rule separate from string
    // comparison (and this dataset has real artists literally named
    // "unknown artist"/"unknown", so a label-text special case would
    // collide with real content), and non-Latin-script artist names sort
    // after "Z" under this locale's collation — a string-range filter
    // mishandles both. A plain "which slot did this already-correctly-
    // sorted group land in" map sidesteps every edge case at once.

    // A group label's own leading character, uppercased — used only for
    // the short chip text ("M–P"), never for matching. This has to be the
    // label's actual first character, not its first *letter*: a handful of
    // KMHD artist names start with a quote or "@" (e.g. a guest DJ
    // handle), and those sort before every plain letter, so skipping ahead
    // to the first letter would mislabel where the bucket really falls.
    // '#' covers that leading-symbol case, plus any label made entirely of
    // non-Latin script.
    function bucketLetter(label) {
        const ch = (label || '').trim().charAt(0);
        return /[A-Za-z0-9]/.test(ch) ? ch.toUpperCase() : '#';
    }

    // Every distinct artist in the FULL dataset (not affected by the year
    // filter, so bucket boundaries mean the same thing on every page),
    // paired [lowercased key, original-case label] and sorted with the
    // exact comparator the artist sort itself uses. "Unknown artist"
    // (empty artist string) is excluded here — it always lands in the
    // final, open-ended bucket instead, handled in bucketIndexOf.
    function allArtistGroupEntriesSorted() {
        const byKey = new Map();
        allEntries.forEach(entry => {
            const artist = entryArtist(entry);
            if (!artist) return;
            const key = artist.toLowerCase();
            if (!byKey.has(key)) byKey.set(key, artist);
        });
        return Array.from(byKey.entries()).sort((a, b) => compareArtists(a[1], b[1]));
    }

    // Splits the full artist list into a handful of semi-even buckets by
    // count, not by letter. Returns { keyToIndex, labels } or null if
    // there aren't enough artists to bother.
    function computeArtistBucketPlan() {
        const entries = allArtistGroupEntriesSorted();
        const total = entries.length;
        if (total < ARTIST_BUCKET_MIN_TOTAL) return null;
        const numBuckets = Math.max(ARTIST_BUCKET_MIN_COUNT,
            Math.min(ARTIST_BUCKET_MAX_COUNT, Math.round(total / ARTIST_BUCKET_TARGET_SIZE)));
        const keyToIndex = new Map();
        const labels = [];
        let start = 0;
        for (let b = 0; b < numBuckets; b++) {
            const end = Math.round((b + 1) * total / numBuckets);
            if (end <= start) continue;
            const bIdx = labels.length;
            for (let i = start; i < end; i++) keyToIndex.set(entries[i][0], bIdx);
            const first = bucketLetter(entries[start][1]);
            const last = bucketLetter(entries[end - 1][1]);
            labels.push(first === last ? first : `${first}–${last}`);
            start = end;
        }
        return { keyToIndex, labels };
    }

    // Which bucket index `entry` falls in, per the given plan — "Unknown
    // artist" always goes to the last (open-ended) bucket, alongside
    // whatever real content already landed there.
    function bucketIndexOf(entry, plan) {
        if (!plan) return -1;
        const artist = entryArtist(entry);
        if (!artist) return plan.labels.length - 1;
        const idx = plan.keyToIndex.get(artist.toLowerCase());
        return idx === undefined ? -1 : idx;
    }

    function renderBucketNav(plan) {
        const nav = document.getElementById('bucketNav');
        nav.innerHTML = '';
        if (!plan) { nav.hidden = true; return; }
        const chip = (href, text, current) => {
            const a = document.createElement('a');
            a.href = href;
            a.textContent = text;
            if (current) a.setAttribute('aria-current', 'page');
            nav.appendChild(a);
        };
        chip('headnod-tracklist.html?sort=artist', 'All artists', !bucketFilter);
        plan.labels.forEach((label, i) => {
            const qs = new URLSearchParams({ sort: 'artist', bucket: String(i) }).toString();
            chip('headnod-tracklist.html?' + qs, label, !!bucketFilter && bucketFilter.index === i);
        });
        nav.hidden = false;
    }

    // ---------------- URL deep link (?sort=, ?bucket=) ----------------
    // Read-only, same pattern as headnod.html's ?date= link: parsed once at
    // load and never written back. A bucket index only means anything in
    // artist order, so it forces currentSort regardless of ?sort=.

    function applyUrlParams() {
        const params = new URLSearchParams(location.search);
        const bucketParam = params.get('bucket');
        if (bucketParam !== null && /^\d+$/.test(bucketParam)) {
            currentSort = 'artist';
            bucketFilter = { index: parseInt(bucketParam, 10), label: '' };
        } else {
            const sort = params.get('sort');
            if (sort === 'date' || sort === 'year' || sort === 'artist') currentSort = sort;
        }
        document.getElementById('sortSelect').value = currentSort;
    }

    // Fills in the bucket's display label once the real plan exists, and
    // updates the tab title. A bucket index with no matching label (a
    // stale link after the artist list has shifted enough to change the
    // bucket count) keeps a generic label — the empty-result message in
    // renderAllTracks covers that case, this just keeps it from saying
    // "undefined".
    function resolveBucketFilterLabel() {
        if (!bucketFilter) return;
        bucketFilter.label = (artistBucketPlan && artistBucketPlan.labels[bucketFilter.index]) || 'this range';
        document.title = `Artists ${bucketFilter.label} · Every Headnod Track`;
    }

    function toggleGroup(group) {
        const collapsed = group.classList.toggle('collapsed');
        group.querySelector('.group-header').setAttribute('aria-expanded', String(!collapsed));
        updateCollapseToggleLabel();
    }

    function renderAllTracks() {
        const container = document.getElementById('allTracksWrap');
        container.innerHTML = '';

        const filtered = allEntries.filter(e =>
            (!yearFilter || e.date.slice(0, 4) === yearFilter)
            && (!bucketFilter || bucketIndexOf(e, artistBucketPlan) === bucketFilter.index));

        if (filtered.length === 0) {
            const none = document.createElement('div');
            none.className = 'small';
            none.style.textAlign = 'center';
            none.textContent = allEntries.length === 0 ? 'No tracks logged for any known Friday yet.'
                : bucketFilter && yearFilter ? `No tracks by artists ${bucketFilter.label} played in ${yearFilter}.`
                : bucketFilter ? `No artists in the range ${bucketFilter.label} — the artist list may have shifted since this link was made. Try "All artists" below.`
                : `No tracks played in ${yearFilter}.`;
            container.appendChild(none);
            renderBucketNav(currentSort === 'artist' ? artistBucketPlan : null);
            renderSummary(filtered);
            updateCollapseToggleLabel();
            return;
        }

        // Grouped by artist or year, the date is the only way back to that
        // Friday's full show — grouped by date, the Friday is already the
        // group header, so a link on every row would just repeat it.
        const linkDates = currentSort !== 'date';
        const collapseByDefault = collapseGroupsByDefault();

        const sorted = filtered.slice().sort(compareEntries);
        const counts = new Map();
        sorted.forEach(entry => {
            const key = groupKey(entry);
            counts.set(key, (counts.get(key) || 0) + 1);
        });

        renderBucketNav(currentSort === 'artist' ? artistBucketPlan : null);

        const table = document.createElement('table');
        table.className = 'tracks';
        const frag = document.createDocumentFragment();
        let group = null;
        let lastKey;
        sorted.forEach(entry => {
            const key = groupKey(entry);
            if (key !== lastKey) {
                group = document.createElement('tbody');
                group.className = 'track-group';
                if (collapseByDefault) group.classList.add('collapsed');
                const headerRow = document.createElement('tr');
                headerRow.className = 'group-header';
                headerRow.tabIndex = 0;
                headerRow.setAttribute('role', 'button');
                headerRow.setAttribute('aria-expanded', String(!collapseByDefault));
                const headerCell = document.createElement('td');
                headerCell.colSpan = 3;
                headerCell.textContent = `${groupLabel(entry)} (${counts.get(key)})`;
                headerRow.appendChild(headerCell);
                // `group` is reassigned on every new group below, so the
                // click handler needs its own stable binding rather than
                // reading the shared outer variable — otherwise every
                // header ends up toggling whichever group was created last.
                const thisGroup = group;
                headerRow.addEventListener('click', () => toggleGroup(thisGroup));
                headerRow.addEventListener('keydown', e => {
                    if (e.key !== 'Enter' && e.key !== ' ') return;
                    e.preventDefault();
                    toggleGroup(thisGroup);
                });
                group.appendChild(headerRow);
                frag.appendChild(group);
                lastKey = key;
            }
            group.appendChild(buildTrackRow(entry.item, entry.date, linkDates));
        });
        table.appendChild(frag);
        container.appendChild(table);
        renderSummary(filtered);
        updateCollapseToggleLabel();
    }

    function updateCollapseToggleLabel() {
        const btn = document.getElementById('collapseToggle');
        const groups = document.querySelectorAll('#allTracksWrap tbody.track-group');
        if (groups.length === 0) { btn.disabled = true; btn.textContent = 'Collapse all'; return; }
        btn.disabled = false;
        const anyExpanded = Array.from(groups).some(g => !g.classList.contains('collapsed'));
        btn.textContent = anyExpanded ? 'Collapse all' : 'Expand all';
    }

    function populateYearFilter() {
        const select = document.getElementById('yearFilterSelect');
        const years = Array.from(new Set(allEntries.map(e => e.date.slice(0, 4)))).sort((a, b) => b.localeCompare(a));
        years.forEach(y => {
            const opt = document.createElement('option');
            opt.value = y;
            opt.textContent = y;
            select.appendChild(opt);
        });
    }

    function setupControls() {
        document.getElementById('sortSelect').addEventListener('change', e => {
            // A bucket range only makes sense in artist order, and the URL
            // is never rewritten in place (no pushState here) — so any
            // sort change on a filtered page is a plain navigation to a
            // clean one. Picking "artist" again is therefore also a way
            // back to the full unfiltered list.
            if (bucketFilter) {
                location.href = 'headnod-tracklist.html?sort=' + encodeURIComponent(e.target.value);
                return;
            }
            currentSort = e.target.value;
            renderAllTracks();
        });
        document.getElementById('yearFilterSelect').addEventListener('change', e => {
            yearFilter = e.target.value;
            renderAllTracks();
        });
        document.getElementById('collapseToggle').addEventListener('click', () => {
            const groups = document.querySelectorAll('#allTracksWrap tbody.track-group');
            const anyExpanded = Array.from(groups).some(g => !g.classList.contains('collapsed'));
            groups.forEach(g => {
                g.classList.toggle('collapsed', anyExpanded);
                g.querySelector('.group-header').setAttribute('aria-expanded', String(!anyExpanded));
            });
            updateCollapseToggleLabel();
        });
    }

    // ---------------- track rows ----------------
    // Same row shape as headnod.html's buildTrackRow, plus one addition:
    // this page merges every known Friday into one list, so each row also
    // gets the date it aired on next to its time — without it, a track
    // that aired on two different Fridays looks like an unexplained
    // duplicate.

    function yearOf(item) {
        const kmhd = PlaylistUtils.trackYear(item);
        if (kmhd) return kmhd;
        return PlaylistUtils.trackYear(PlaylistUtils.expandEntry(item));
    }

    function buildTrackRow(item, playedDate, linkPlayedDate) {
        const startTime = PlaylistUtils.trackStartDate(item);
        const options = { hour: 'numeric', minute: 'numeric', hour12: true };
        const localTime = startTime ? startTime.toLocaleTimeString([], options).replace(/^0/, '') : '';
        const rowYear = yearOf(item);
        const { title, artist, album } = PlaylistUtils.mapItemFields(item);

        const row = document.createElement('tr');
        row.className = 'track-row';

        const timeCell = document.createElement('td');
        timeCell.className = 'start-time';
        timeCell.textContent = localTime;
        if (playedDate) {
            // Grouped by date, the Friday is already the group header; a
            // link there would just repeat it. Grouped by artist or year,
            // it's the only way back to that Friday's full show.
            const dateEl = document.createElement(linkPlayedDate ? 'a' : 'div');
            dateEl.className = 'played-date';
            dateEl.textContent = shortDate(playedDate);
            if (linkPlayedDate) {
                dateEl.href = `headnod.html?date=${encodeURIComponent(playedDate)}`;
                dateEl.title = 'See this Friday’s full Headnod tracklist';
            }
            timeCell.appendChild(dateEl);
        }
        row.appendChild(timeCell);

        const artCell = document.createElement('td');
        const albumCoverContainer = document.createElement('div');
        albumCoverContainer.className = 'album-cover-container';
        if (item.artworkUrl) {
            const img = document.createElement('img');
            img.src = item.artworkUrl;
            img.alt = 'Album Cover';
            img.className = 'album-cover';
            albumCoverContainer.appendChild(img);
        } else {
            const ph = document.createElement('div');
            ph.className = 'album-placeholder';
            albumCoverContainer.appendChild(ph);
        }
        artCell.appendChild(albumCoverContainer);
        row.appendChild(artCell);

        const detailsCell = document.createElement('td');
        detailsCell.className = 'column-details';

        const titleEl = document.createElement('span');
        titleEl.className = 'bold track-title';
        titleEl.textContent = title;
        detailsCell.appendChild(titleEl);

        const artistLine = document.createElement('div');
        artistLine.className = 'track-line';
        const artistEl = document.createElement('span');
        artistEl.className = 'bold track-artist';
        artistEl.textContent = artist;
        artistLine.appendChild(document.createTextNode('by '));
        artistLine.appendChild(artistEl);
        detailsCell.appendChild(artistLine);

        if (album) {
            const albumLine = document.createElement('div');
            albumLine.className = 'small track-line';
            albumLine.appendChild(document.createTextNode('from '));
            const albumEl = document.createElement('span');
            albumEl.className = 'bold track-album';
            albumEl.textContent = album;
            albumLine.appendChild(albumEl);
            detailsCell.appendChild(albumLine);
        }

        const yearGenreLine = document.createElement('div');
        yearGenreLine.className = 'small track-yeargenre track-line';
        if (rowYear) {
            const yearEl = document.createElement('span');
            yearEl.className = 'track-year';
            yearEl.textContent = rowYear;
            yearGenreLine.appendChild(yearEl);
        }
        const genreBadge = document.createElement('span');
        genreBadge.className = 'track-genre';
        genreBadge.style.display = 'none';
        yearGenreLine.appendChild(genreBadge);
        detailsCell.appendChild(yearGenreLine);

        if (title && artist) {
            const links = PlaylistUtils.searchLinks({ title, artist, album });
            const linksRow = document.createElement('div');
            linksRow.className = 'track-links';
            const addLink = (url, label, className, tooltip) => {
                if (!url) return;
                const a = document.createElement('a');
                a.href = url;
                a.target = '_blank';
                a.rel = 'noopener';
                a.textContent = label;
                if (className) a.className = className;
                if (tooltip) a.title = tooltip;
                linksRow.appendChild(a);
            };
            addLink(links.appleMusic, 'Apple Music', 'apple-music-link', 'Search Apple Music for this track');
            addLink(links.youtube, 'YouTube (live)');
            addLink(links.ebayVinyl, 'eBay (vinyl)');
            addLink(links.ebayCd, 'eBay (CD)');
            addLink(links.tidal, 'Tidal');
            addLink(links.wiki, 'Wiki');
            detailsCell.appendChild(linksRow);
        }

        row.appendChild(detailsCell);

        // headnod-tracks.json already carries whatever Apple Music data was
        // known at build time (see scripts/build-headnod-tracklist.js), so
        // this is a synchronous data transform, not a network lookup —
        // unlike headnod.html/index.html, there is no live-fetch queue or
        // IntersectionObserver here at all.
        applyEnrichment({ row, coverContainer: albumCoverContainer }, PlaylistUtils.expandEntry(item));

        return row;
    }

    // Decorates a built row with whatever Apple Music data `info` has:
    // exact track/artist/album links (swapped onto the plain text), album
    // art, and the year/genre line. Every field access is guarded, so
    // calling this with an empty `info` (a track with no enrich match) is
    // a safe no-op — the row already has its instant search-link fallback.
    function applyEnrichment(job, info) {
        const { row, coverContainer } = job;

        if (info.artworkUrl100) {
            coverContainer.innerHTML = '';
            const img = document.createElement('img');
            img.src = info.artworkUrl100;
            img.alt = 'Album Cover';
            img.className = 'album-cover';
            coverContainer.appendChild(img);
        }

        const linkify = (el, url) => {
            if (!el || !url) return;
            const a = document.createElement('a');
            a.href = url;
            a.target = '_blank';
            a.rel = 'noopener';
            a.className = el.className;
            a.textContent = el.textContent;
            el.replaceWith(a);
        };
        linkify(row.querySelector('.track-title'), info.trackViewUrl);
        linkify(row.querySelector('.track-artist'), info.artistViewUrl);
        linkify(row.querySelector('.track-album'), info.collectionViewUrl);

        const linksRow = row.querySelector('.track-links');
        if (linksRow && info.trackViewUrl) {
            let a = linksRow.querySelector('.apple-music-link');
            if (!a) {
                a = document.createElement('a');
                a.className = 'apple-music-link';
                a.target = '_blank';
                a.rel = 'noopener';
                a.textContent = 'Apple Music';
                linksRow.insertBefore(a, linksRow.firstChild);
            }
            a.href = info.trackViewUrl;
            a.title = 'Open this track in Apple Music';
        }

        const yearGenreLine = row.querySelector('.track-yeargenre');
        if (yearGenreLine && !yearGenreLine.querySelector('.track-year')) {
            const year = PlaylistUtils.trackYear(info);
            if (year) {
                const yearEl = document.createElement('span');
                yearEl.className = 'track-year';
                yearEl.textContent = year;
                yearGenreLine.insertBefore(yearEl, yearGenreLine.firstChild);
            }
        }

        const genreBadge = row.querySelector('.track-genre');
        if (genreBadge && info.primaryGenreName) {
            const hasYear = !!(yearGenreLine && yearGenreLine.querySelector('.track-year'));
            genreBadge.textContent = (hasYear ? ' - ' : '') + info.primaryGenreName;
            genreBadge.style.display = 'inline';
        }
    }

    // ---------------- theme toggle ----------------

    function systemPrefersDark() {
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    }

    function currentTheme() {
        const saved = (() => { try { return localStorage.getItem('theme'); } catch (e) { return null; } })();
        if (saved === 'dark' || saved === 'light') return saved;
        return systemPrefersDark() ? 'dark' : 'light';
    }

    function applyThemeButtonLabel() {
        document.getElementById('themeToggle').textContent = currentTheme() === 'dark' ? '☀️' : '🌙';
    }

    function setupThemeToggle() {
        applyThemeButtonLabel();
        document.getElementById('themeToggle').addEventListener('click', () => {
            const next = currentTheme() === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) { /* ignore */ }
            applyThemeButtonLabel();
        });
    }

    // ---------------- page ----------------

    function showRangeLine() {
        const dates = Array.from(new Set(allEntries.map(e => e.date))).sort();
        document.getElementById('rangeLine').textContent = dates.length
            ? `Every Friday from ${friendlyDate(dates[0])} through ${friendlyDate(dates[dates.length - 1])}.`
            : '';
    }

    // Recomputed on every render (not just once) so it reflects whichever
    // combination of bucket and year filter is active, rather than always
    // showing the whole dataset's numbers.
    function renderSummary(entries) {
        const summary = document.getElementById('summary');
        const days = new Set(entries.map(e => e.date)).size;
        const plural = (c, word) => `${c.toLocaleString()} ${word}${c === 1 ? '' : 's'}`;
        let text;
        if (bucketFilter && yearFilter) {
            const artists = new Set(entries.map(e => (entryArtist(e) || 'Unknown artist').toLowerCase())).size;
            text = `Artists ${bucketFilter.label}, played in ${yearFilter}: ${plural(entries.length, 'track')} by ${plural(artists, 'artist')} across ${plural(days, 'Friday')}.`;
        } else if (bucketFilter) {
            const artists = new Set(entries.map(e => (entryArtist(e) || 'Unknown artist').toLowerCase())).size;
            text = `Artists ${bucketFilter.label}: ${plural(entries.length, 'track')} by ${plural(artists, 'artist')} across ${plural(days, 'Friday')}.`;
        } else if (yearFilter) {
            text = `Played in ${yearFilter}: ${plural(entries.length, 'track')} across ${plural(days, 'Friday')}.`;
        } else {
            text = `${plural(entries.length, 'track')} across ${plural(days, 'known Friday')}.`;
        }
        summary.textContent = text;
        summary.style.display = 'block';
    }

    window.addEventListener('load', () => {
        setupThemeToggle();

        if (typeof PlaylistUtils === 'undefined' || typeof PlaylistUtils.expandEntry !== 'function') {
            document.getElementById('loading').style.display = 'none';
            const err = document.getElementById('error');
            err.textContent = 'This page needs to reload to pick up a recent update. Please refresh (Ctrl/Cmd+Shift+R) and try again.';
            err.style.display = 'block';
            return;
        }
        setupControls();
        applyUrlParams();

        fetch('headnod-tracks.json')
            .then(r => {
                if (!r.ok) throw new Error(`headnod-tracks.json responded ${r.status}`);
                return r.json();
            })
            .then(data => {
                allEntries = (data.tracks || []).map(t => ({ date: t.date, item: t }));
                document.getElementById('loading').style.display = 'none';
                if (allEntries.length === 0) {
                    const err = document.getElementById('error');
                    err.textContent = 'Couldn’t load any tracks. Check your connection and refresh.';
                    err.style.display = 'block';
                    document.getElementById('rangeLine').textContent = '';
                    return;
                }
                showRangeLine();
                populateYearFilter();
                artistBucketPlan = computeArtistBucketPlan();
                resolveBucketFilterLabel();
                renderAllTracks();
            })
            .catch(() => {
                document.getElementById('loading').style.display = 'none';
                const err = document.getElementById('error');
                err.textContent = 'Couldn’t load the tracklist. Check your connection and refresh.';
                err.style.display = 'block';
                document.getElementById('rangeLine').textContent = '';
            });
    });
</script>

</body>
</html>
